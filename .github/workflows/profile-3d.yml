name: Generate 3D contribution terrain

on:
  push:
    branches:
      - main
    paths:
      - "profile-3d-contrib/settings-ocean-research.json"
      - ".github/workflows/profile-3d.yml"
  schedule:
    - cron: "27 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: "profile-3d-contrib/settings-ocean-research.json"
      - name: Commit and push 3D contribution terrain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No 3D terrain changes"
          else
            git commit -m "chore(profile): refresh 3D contribution terrain"
            git push
          fi
