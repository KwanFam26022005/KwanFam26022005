name: Update contribution snake

on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: generated/github-contribution-grid-snake.svg?palette=github-dark
      - name: Commit contribution animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/github-contribution-grid-snake.svg
          if git diff --cached --quiet; then
            echo "No contribution changes"
          else
            git commit -m "chore(profile): refresh contribution graph"
            git push
          fi
