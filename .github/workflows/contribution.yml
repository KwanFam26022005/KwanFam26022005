name: Update contribution heatmap

on:
  push:
    branches:
      - main
    paths:
      - "scripts/render-contributions.mjs"
      - "config/profile.json"
      - ".github/workflows/contribution.yml"
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render contribution heatmap
        run: npm run render:contrib
      - name: Commit contribution asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo "No contribution changes"
          else
            git commit -m "chore(profile): refresh contribution heatmap"
            git push
          fi
