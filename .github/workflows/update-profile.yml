name: Update profile telemetry

on:
  push:
    branches:
      - main
    paths:
      - "scripts/render-metrics.mjs"
      - "scripts/render-projects.mjs"
      - "scripts/render-selected-work.mjs"
      - "scripts/github-data.mjs"
      - "scripts/utils.mjs"
      - "config/profile.json"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render dynamic SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run render
      - name: Commit changed generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No telemetry changes"
          else
            git commit -m "chore(profile): refresh telemetry"
            git push
          fi
