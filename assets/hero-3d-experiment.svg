<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Phạm Hồng Đăng Khoa — AI Systems Engineer focused on Computer Vision and Agentic-RAG">
<defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }

    /* Terminal Command Line */
    .term-user { font-size: 12px; fill: #0969da; font-weight: 600; }
    .term-sep  { font-size: 12px; fill: #64748b; }
    .term-path { font-size: 12px; fill: #475569; }
    .term-cmd  { font-size: 12px; fill: #0f172a; font-weight: 600; }

    /* Headline and Identity */
    .hero-name { font-size: 30px; font-weight: 700; fill: #0f172a; letter-spacing: -0.4px; }
    .hero-role { font-size: 13.5px; font-weight: 500; fill: #334155; letter-spacing: 0.2px; }
    .hero-desc { font-size: 12.5px; font-weight: 400; fill: #475569; }

    /* Focus Chips */
    .chip-cv-txt  { font-size: 11px; font-weight: 600; fill: #0f172a; letter-spacing: 0.5px; }
    .chip-rag-txt { font-size: 11px; font-weight: 600; fill: #0f172a; letter-spacing: 0.5px; }

    /* Code Signature Lines */
    .code-fn      { font-size: 12px; font-weight: 500; fill: #0969da; }
    .code-op      { font-size: 12px; fill: #64748b; }
    .code-str-cv  { font-size: 12px; fill: #0f172a; }
    .code-str-rag { font-size: 12px; fill: #0f172a; }
    .code-dom-val { font-size: 12px; fill: #0284c7; }

    /* 3D Tier Hierarchy Labels */
    .stage-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #0969da; }
    .stage-lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; fill: #0f172a; }

    /* Motion System 1: Terminal cursor blink */
    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    .cursor-anim { animation: blink 1.1s infinite; fill: #0969da; }

    /* Motion System 2: Calm 3D Object Idle Float */
    @keyframes core-float {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-5px); }
    }
    .float-core { animation: core-float 12s ease-in-out infinite; }

    /* Motion System 3: Observation Plane Scan Sweep */
    @keyframes scan-sweep {
      0%   { transform: translate(-70px, -35px); opacity: 0; }
      15%  { opacity: 0.75; }
      85%  { opacity: 0.75; }
      100% { transform: translate(70px, 35px); opacity: 0; }
    }
    .scan-line-anim { animation: scan-sweep 7.2s ease-in-out infinite; }
  </style>

  <!-- Clean Canvas Gradient -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="50%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#f1f5f9"/>
  </linearGradient>

  <!-- 3D Platform Facet Gradients -->
  <linearGradient id="plat-top" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#e2e8f0"/>
    <stop offset="100%" stop-color="#f1f5f9"/>
  </linearGradient>

  <!-- 3D Verification Prism Gradients -->
  <linearGradient id="prism-top" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#dbeafe"/>
    <stop offset="100%" stop-color="#bfdbfe"/>
  </linearGradient>

  <!-- Isometric Scan Gradient -->
  <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
    <stop offset="50%" stop-color="#0969da" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
  </linearGradient>

  <!-- Coordinate Matrix Pattern -->
  <pattern id="grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.75" fill="#94a3b8" opacity="0.3"/>
  </pattern>

  <linearGradient id="grid-fade" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
  </linearGradient>
  <mask id="grid-mask">
    <rect width="1000" height="330" fill="url(#grid-fade)"/>
  </mask>

  <!-- Typewriter Clip Path for Terminal Command -->
  <clipPath id="cmd-clip">
    <rect x="0" y="-15" width="0" height="25">
      <animate attributeName="width"
        values="0; 0; 130; 130; 130; 0"
        keyTimes="0; 0.1; 0.45; 0.85; 0.95; 1"
        dur="6s" repeatCount="indefinite" />
    </rect>
  </clipPath>
</defs>

<!-- Canvas Base Background with Subtle Technical Border -->
<rect width="1000" height="330" rx="14" fill="url(#bg)" stroke="#d0d7de" stroke-width="1.2"/>
<rect width="1000" height="330" rx="14" fill="url(#grid)" mask="url(#grid-mask)"/>

<!-- ================= LEFT COLUMN: IDENTITY & CODE SPECIFICATION ================= -->

<!-- 1. Authentic Terminal Line with Typing Effect -->
<g transform="translate(56, 36)" class="mono">
  <text x="0" y="0">
    <tspan class="term-user">khoa@github</tspan><tspan class="term-sep">:</tspan><tspan class="term-path">~$ </tspan>
  </text>
  <!-- Animated Typing Command -->
  <g transform="translate(108, 0)" clip-path="url(#cmd-clip)">
    <text x="0" y="0" class="term-cmd">./init --research</text>
  </g>
  <!-- Moving & Blinking Cursor -->
  <rect x="108" y="-10.5" width="7.5" height="13.5" rx="1" fill="#0969da" class="cursor-anim">
    <animate attributeName="x"
      values="108; 108; 236; 236; 236; 108"
      keyTimes="0; 0.1; 0.45; 0.85; 0.95; 1"
      dur="6s" repeatCount="indefinite" />
  </rect>
</g>

<!-- 2. Primary Developer Identity -->
<text x="56" y="86" class="sans hero-name">Ph&#7841;m H&#7891;ng &#272;&#259;ng Khoa</text>

<!-- 3. Subtitle: Role and Specializations -->
<text x="56" y="114" class="mono hero-role">
  AI Systems Engineer
  <tspan fill="#64748b"> &#183; </tspan>
  <tspan fill="#0969da">Computer Vision</tspan>
  <tspan fill="#64748b"> &#183; </tspan>
  <tspan fill="#0969da">Agentic-RAG</tspan>
</text>

<!-- 4. Research Statement -->
<text x="56" y="138" class="sans hero-desc">Building measurable, evidence-aware AI systems from research to real-world use.</text>

<!-- 5. Two Primary Focus Chips (Elevated Slate) -->
<g transform="translate(56, 164)" class="mono">
  <!-- Chip 1: CV / OCR Systems -->
  <g>
    <rect width="158" height="29" rx="6" fill="#f8fafc" stroke="#d0d7de" stroke-width="1.2"/>
    <g transform="translate(11, 7.5)">
      <path d="M 0 4 L 0 0 L 4 0" fill="none" stroke="#0969da" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 10 0 L 14 0 L 14 4" fill="none" stroke="#0969da" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 0 10 L 0 14 L 4 14" fill="none" stroke="#0969da" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 10 14 L 14 14 L 14 10" fill="none" stroke="#0969da" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="7" cy="7" r="1.6" fill="#0969da"/>
    </g>
    <text x="35" y="18.5" class="chip-cv-txt">CV / OCR SYSTEMS</text>
  </g>

  <!-- Chip 2: Agentic-RAG / Evidence -->
  <g transform="translate(170, 0)">
    <rect width="198" height="29" rx="6" fill="#f8fafc" stroke="#d0d7de" stroke-width="1.2"/>
    <g transform="translate(11, 7.5)">
      <line x1="2" y1="12" x2="7" y2="3" stroke="#0969da" stroke-width="1.4"/>
      <line x1="12" y1="12" x2="7" y2="3" stroke="#0969da" stroke-width="1.4"/>
      <line x1="2" y1="12" x2="12" y2="12" stroke="#0969da" stroke-width="1.4"/>
      <circle cx="7" cy="3" r="1.8" fill="#0969da"/>
      <circle cx="2" cy="12" r="1.6" fill="#f8fafc" stroke="#0969da" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="1.6" fill="#f8fafc" stroke="#0969da" stroke-width="1.2"/>
    </g>
    <text x="35" y="18.5" class="chip-rag-txt">AGENTIC-RAG / EVIDENCE</text>
  </g>
</g>

<!-- 6. Coding Signature Block -->
<g transform="translate(56, 236)" class="mono">
  <text x="0" y="0">
    <tspan class="code-fn">research</tspan><tspan class="code-op">.</tspan><tspan class="code-fn">focus</tspan>
    <tspan class="code-op"> = [</tspan>
    <tspan class="code-str-cv">"computer_vision"</tspan><tspan class="code-op">, </tspan>
    <tspan class="code-str-rag">"agentic_rag"</tspan>
    <tspan class="code-op">]</tspan>
  </text>
  <text x="0" y="22">
    <tspan class="code-fn">application</tspan><tspan class="code-op">.</tspan><tspan class="code-fn">domain</tspan>
    <tspan class="code-op"> = </tspan>
    <tspan class="code-dom-val">"healthcare_ai"</tspan>
  </text>
</g>

<!-- Visual Connecting Guide between Left Spec and 3D Core -->
<path d="M 426 178 C 500 178, 555 160, 620 160"
      fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="2 4" opacity="0.6"/>

<!-- ================= RIGHT COLUMN: 3D RESEARCH CORE (ISOMETRIC COMPOSITION) ================= -->
<g class="float-core">

  <!-- Vertical Coordinate Axes (Technical alignment wireframes) -->
  <line x1="760" y1="45" x2="760" y2="255" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="630" y1="215" x2="890" y2="215" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- ================= TIER 1 (BOTTOM): OBSERVATION & SCAN PLANE (CV / OCR) ================= -->
  <g id="tier-1-observe">
    <!-- Platform Shadow -->
    <polygon points="760,202 895,236 760,270 625,236" fill="#cbd5e1" opacity="0.3"/>

    <!-- Left Side Depth Facet -->
    <polygon points="630,225 760,258 760,272 630,239" fill="#cbd5e1" stroke="#0969da" stroke-width="1.1"/>

    <!-- Right Side Depth Facet -->
    <polygon points="760,258 890,225 890,239 760,272" fill="#94a3b8" stroke="#0969da" stroke-width="1.1"/>

    <!-- Top Isometric Plane Face -->
    <polygon points="760,192 890,225 760,258 630,225" fill="url(#plat-top)" stroke="#0969da" stroke-width="1.5"/>

    <!-- Internal Isometric Grid Lines on Observation Platform -->
    <path d="M 662,217 L 760,242 L 858,217" fill="none" stroke="#0969da" stroke-width="1.1" opacity="0.5"/>
    <path d="M 695,209 L 760,225 L 825,209" fill="none" stroke="#0969da" stroke-width="1.1" opacity="0.5"/>
    <path d="M 728,200 L 760,209 L 792,200" fill="none" stroke="#0969da" stroke-width="1.1" opacity="0.4"/>

    <!-- Feature Target Bounding Brackets (Isometric OCR Region 1) -->
    <g transform="translate(675, 216)">
      <polygon points="0,6 20,11 40,6 20,1" fill="#f8fafc" stroke="#0969da" stroke-width="1.2"/>
      <circle cx="20" cy="6" r="2" fill="#0969da"/>
    </g>

    <!-- Feature Target Bounding Brackets (Isometric OCR Region 2) -->
    <g transform="translate(775, 230)">
      <polygon points="0,6 26,12.5 52,6 26,-0.5" fill="#f8fafc" stroke="#0969da" stroke-width="1.3"/>
      <circle cx="26" cy="6" r="2" fill="#0969da"/>
      <line x1="8" y1="5.5" x2="44" y2="6.5" stroke="#94a3b8" stroke-width="1.0"/>
    </g>

    <!-- Moving Scan Line Sweep on Observation Plane -->
    <g class="scan-line-anim">
      <line x1="680" y1="205" x2="840" y2="245" stroke="url(#scan-grad)" stroke-width="2.4"/>
    </g>

    <!-- Tier 1 Metadata & Technical Label -->
    <g class="mono" transform="translate(895, 218)">
      <line x1="-16" y1="5" x2="-4" y2="5" stroke="#0969da" stroke-width="1.2"/>
      <text x="0" y="-4" class="stage-tag">01 · OBSERVE</text>
      <text x="0" y="12" class="stage-lbl">CV / OCR</text>
    </g>
  </g>

  <!-- Isometric Inter-Tier Uplinks (Observe to Retrieve) -->
  <path d="M 685,215 C 685,185 710,165 730,150" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 3"/>
  <path d="M 785,225 C 785,190 770,170 760,148" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- ================= TIER 2 (MIDDLE): RETRIEVAL NETWORK (AGENTIC-RAG) ================= -->
  <g id="tier-2-retrieve">
    <!-- Hovering Reference Hexagon -->
    <polygon points="760,118 825,134 825,150 760,166 695,150 695,134"
             fill="none" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="3 3" opacity="0.7"/>

    <!-- Knowledge Network Interconnect Edges -->
    <line x1="695" y1="138" x2="760" y2="142" stroke="#0969da" stroke-width="1.5" opacity="0.7"/>
    <line x1="825" y1="132" x2="760" y2="142" stroke="#0969da" stroke-width="1.5" opacity="0.7"/>
    <line x1="720" y1="158" x2="760" y2="142" stroke="#94a3b8" stroke-width="1.3"/>
    <line x1="800" y1="156" x2="760" y2="142" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- Peripheral Knowledge Nodes with Depth Rings -->
    <g transform="translate(695, 138)">
      <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="2.2" fill="#2563eb"/>
    </g>

    <g transform="translate(825, 132)">
      <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="2.2" fill="#2563eb"/>
    </g>

    <g transform="translate(800, 156)">
      <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="1.8" fill="#2563eb"/>
    </g>

    <g transform="translate(720, 158)">
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="1.6" fill="#2563eb"/>
    </g>

    <!-- Central Multi-Agent Orchestrator Node (Hub) -->
    <g transform="translate(760, 142)">
      <circle cx="0" cy="0" r="12" fill="#f8fafc" stroke="#0969da" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="3" fill="#2563eb"/>
    </g>

    <!-- Tier 2 Metadata & Technical Label -->
    <g class="mono" transform="translate(680, 138)" text-anchor="end">
      <text x="0" y="-4" class="stage-tag">02 · RETRIEVE</text>
      <text x="0" y="11" class="stage-lbl">Agentic-RAG</text>
    </g>
  </g>

  <!-- Isometric Inter-Tier Uplinks (Retrieve to Verify) -->
  <path d="M 760,130 L 760,92" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="2 3"/>

  <!-- ================= TIER 3 (TOP): VERIFICATION CORE (EVIDENCE GROUNDED) ================= -->
  <g id="tier-3-verify">
    <!-- Verification Halo -->
    <circle cx="760" cy="62" r="22" fill="#f8fafc" opacity="0.6"/>

    <!-- Isometric Verification Prism (3D faceted volume) -->
    <polygon points="760,44 782,55 760,66 738,55" fill="url(#prism-top)" stroke="#0969da" stroke-width="1.5"/>
    <polygon points="738,55 760,66 760,84 738,73" fill="#93c5fd" stroke="#0969da" stroke-width="1.2"/>
    <polygon points="760,66 782,55 782,73 760,84" fill="#60a5fa" stroke="#0969da" stroke-width="1.2"/>

    <!-- Verified Badge Check Mark -->
    <g transform="translate(760, 55)">
      <circle cx="0" cy="0" r="9" fill="#0969da" stroke="#0969da" stroke-width="1.6"/>
      <path d="M -3.5 -0.2 L -1.0 2.4 L 4.2 -2.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Tier 3 Metadata & Technical Label -->
    <g class="mono" transform="translate(805, 58)">
      <text x="0" y="-4" class="stage-tag">03 · VERIFY</text>
      <text x="0" y="11" class="stage-lbl">Evidence grounding</text>
    </g>
  </g>

  <!-- Continuous Data Signal -->
  <circle r="3" fill="#0969da">
    <animateMotion path="M 785,230 C 785,190 770,165 760,142 C 760,120 760,85 760,55"
                   dur="8.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="0; 0.95; 0.8; 1; 0"
             keyTimes="0; 0.2; 0.55; 0.85; 1"
             dur="8.8s" repeatCount="indefinite"/>
  </circle>

</g>

<!-- ================= AMBIENT OCEAN MOTIF (CALM BASE) ================= -->
<g>
  <path d="M 0 304 Q 260 288, 520 302 T 1000 296 L 1000 330 L 0 330 Z" fill="#f1f5f9" opacity="0.5"/>
  <path d="M 0 315 Q 240 307, 500 315 T 1000 311" fill="none" stroke="#e2e8f0" stroke-width="0.9" opacity="0.6"/>
  <path d="M 0 309 Q 250 299, 500 309 T 1000 305" fill="none" stroke="#cbd5e1" stroke-width="1.3" opacity="0.6"/>
</g>

</svg>
