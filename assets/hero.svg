<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Pham Hong Dang Khoa - Healthcare AI and Ocean Systems">
<defs>
  <linearGradient id="ocean-bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#051324"/>
    <stop offset="50%" stop-color="#0a233f"/>
    <stop offset="100%" stop-color="#06182c"/>
  </linearGradient>
  
  <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
    <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0369a1" stop-opacity="0.35"/>
  </linearGradient>

  <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35"/>
    <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#0f766e" stop-opacity="0.35"/>
  </linearGradient>

  <linearGradient id="wave-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
    <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
  </linearGradient>

  <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e4e79"/>
    <stop offset="100%" stop-color="#123554"/>
  </linearGradient>
</defs>

<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .title { font-weight: 800; fill: #f8fafc; letter-spacing: -0.6px; }
  .subtitle { font-weight: 500; fill: #93c5fd; }
  .body { font-weight: 400; fill: #cbd5e1; }
  .pill-text { font-weight: 600; font-size: 11px; fill: #e0f2fe; }
  .card-title { font-weight: 700; font-size: 14px; fill: #f0f9ff; }
  .card-desc { font-weight: 400; font-size: 12px; fill: #94a3b8; }
</style>

<!-- Deep Ocean Canvas -->
<rect width="1000" height="340" rx="18" fill="url(#ocean-bg)"/>

<!-- Organic Layered Ocean Waves (Bezier Curves) -->
<path d="M 0 240 Q 250 190, 500 240 T 1000 220 L 1000 340 L 0 340 Z" fill="url(#wave-grad-1)"/>
<path d="M 0 265 Q 260 215, 520 260 T 1000 245 L 1000 340 L 0 340 Z" fill="url(#wave-grad-2)"/>
<path d="M 0 290 Q 280 250, 540 285 T 1000 270 L 1000 340 L 0 340 Z" fill="url(#wave-grad-3)"/>

<!-- Elegant Fine Wave Crest Lines -->
<path d="M 0 240 Q 250 190, 500 240 T 1000 220" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.45"/>
<path d="M 0 265 Q 260 215, 520 260 T 1000 245" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.35"/>

<!-- Profile Identity Header -->
<g transform="translate(56 42)" class="sans">
  <!-- Topic Pills -->
  <g>
    <rect width="132" height="26" rx="13" fill="#0c2a47" stroke="#1d4d77"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
    <text x="26" y="17" class="pill-text">Ocean &amp; Deep Navy</text>

    <g transform="translate(142 0)">
      <rect width="124" height="26" rx="13" fill="#0c2a47" stroke="#1d4d77"/>
      <circle cx="14" cy="13" r="4" fill="#14b8a6"/>
      <text x="26" y="17" class="pill-text">Healthcare AI</text>
    </g>
  </g>

  <!-- Name -->
  <text y="72" font-size="38" class="title">Phạm Hồng Đăng Khoa</text>
  
  <!-- Subtitle -->
  <text y="102" font-size="16" class="subtitle">AI Systems Engineer · Healthcare AI &amp; Computer Vision</text>
  
  <!-- Philosophy statement -->
  <text y="132" font-size="13" class="body">Building reliable, evidence-grounded AI systems for medicine and computer vision with oceanic clarity.</text>
</g>

<!-- Two Clean, Non-Industrial Cards -->
<g transform="translate(56 200)" class="sans">
  <!-- Card 1: Healthcare AI -->
  <g>
    <rect width="428" height="96" rx="12" fill="#091f36" fill-opacity="0.88" stroke="url(#card-border)"/>
    <line x1="0" y1="16" x2="0" y2="80" stroke="#14b8a6" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Medical Cross -->
    <g transform="translate(20 18)">
      <rect x="3" y="0" width="4" height="10" rx="1.5" fill="#14b8a6"/>
      <rect x="0" y="3" width="10" height="4" rx="1.5" fill="#14b8a6"/>
      <text x="18" y="9" class="card-title">Healthcare AI &amp; Clinical Informatics</text>
    </g>
    <text x="20" y="52" class="card-desc">Medical-NLU entity extraction · Evidence-verified clinical RAG</text>
    <text x="20" y="72" font-size="11" font-weight="500" fill="#2dd4bf">Clinical NLP · Medical Records · Hallucination Auditing</text>
  </g>

  <!-- Card 2: Computer Vision -->
  <g transform="translate(460 0)">
    <rect width="428" height="96" rx="12" fill="#091f36" fill-opacity="0.88" stroke="url(#card-border)"/>
    <line x1="0" y1="16" x2="0" y2="80" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Eye / Document Lens Icon -->
    <g transform="translate(20 18)">
      <circle cx="5" cy="5" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
      <circle cx="5" cy="5" r="2" fill="#38bdf8"/>
      <text x="18" y="9" class="card-title">Computer Vision &amp; Document Intelligence</text>
    </g>
    <text x="20" y="52" class="card-desc">Invoice-engine intake · PP-OCRv6 recognition · Quality gating</text>
    <text x="20" y="72" font-size="11" font-weight="500" fill="#7dd3fc">Document AI · Production FastAPI · Deterministic Validation</text>
  </g>
</g>
</svg>
