<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Kwan AI Systems Lab">
<defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#12354a"/><stop offset="1" stop-color="#061019"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#183244" stroke-width="1" opacity=".38"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.cyan{fill:#72e5ff}.white{fill:#eefaff}.muted{fill:#7c9aac}.trace{stroke:#3ac9ee;stroke-width:1.5;fill:none;stroke-dasharray:7 12;animation:flow 5s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.scan{animation:scan 5s linear infinite}.cursor{animation:blink 1s steps(1) infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(390px)}}@keyframes blink{50%{opacity:0}}
</style>
<rect width="1000" height="360" rx="24" fill="url(#glow)"/><rect width="1000" height="360" rx="24" fill="url(#grid)"/>
<g opacity=".7"><path class="trace" d="M85 260 C190 200 235 305 340 230 S520 185 610 235 S800 285 910 205"/><path class="trace" d="M80 102 C205 160 250 60 370 116 S560 165 675 105 S820 70 920 130"/></g>
<g class="pulse" fill="#67ddff"><circle cx="85" cy="260" r="4"/><circle cx="340" cy="230" r="4"/><circle cx="610" cy="235" r="4"/><circle cx="910" cy="205" r="4"/><circle cx="80" cy="102" r="4"/><circle cx="370" cy="116" r="4"/><circle cx="675" cy="105" r="4"/><circle cx="920" cy="130" r="4"/></g>
<rect x="0" y="-12" width="1000" height="2" fill="#6be6ff" opacity=".3" class="scan"/>
<g transform="translate(76 86)"><text class="mono cyan" font-size="13" letter-spacing="3">KWAN // AI SYSTEMS LAB</text><text y="62" class="sans white" font-size="48" font-weight="750">Khoa Pham</text><text y="99" class="mono muted" font-size="17">AI Systems · Computer Vision · Applied Research</text><text y="142" class="mono white" font-size="14">&gt; building research ideas into measurable systems<tspan class="cursor">_</tspan></text></g>
<g transform="translate(735 64)" class="mono"><rect width="190" height="112" rx="12" fill="#08141e" stroke="#244153"/><text x="18" y="27" class="muted" font-size="10">NODE STATUS</text><text x="18" y="51" class="cyan" font-size="12">CV / OCR</text><text x="142" y="51" class="white" font-size="11">ACTIVE</text><text x="18" y="74" class="cyan" font-size="12">AGENTIC RAG</text><text x="142" y="74" class="white" font-size="11">R&amp;D</text><text x="18" y="97" class="cyan" font-size="12">DATA SYSTEMS</text><text x="142" y="97" class="white" font-size="11">ACTIVE</text></g>
</svg>
