<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Phạm Hồng Đăng Khoa — AI Systems Engineer focused on Computer Vision and Agentic-RAG">
<defs>
  <!-- Deep Navy Ocean Night Canvas -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#040c16"/>
    <stop offset="50%" stop-color="#071320"/>
    <stop offset="100%" stop-color="#091b2c"/>
  </linearGradient>

  <!-- Restrained Specialization Borders -->
  <linearGradient id="chip-cv" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#55a9c9" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#3b7a94" stop-opacity="0.25"/>
  </linearGradient>

  <linearGradient id="chip-rag" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9384c5" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#695b96" stop-opacity="0.25"/>
  </linearGradient>

  <!-- Celestial Glow -->
  <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#2a4b66" stop-opacity="0.28"/>
    <stop offset="60%" stop-color="#142c40" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#071320" stop-opacity="0"/>
  </radialGradient>

  <!-- Subtle Coordinate Matrix -->
  <pattern id="grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.65" fill="#163044" opacity="0.2"/>
  </pattern>
</defs>

<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* Terminal Command Line */
  .term-user { font-size: 11.5px; fill: #55a9c9; font-weight: 600; }
  .term-sep  { font-size: 11.5px; fill: #536d80; }
  .term-path { font-size: 11.5px; fill: #8fa6b8; }
  .term-cmd  { font-size: 11.5px; fill: #edf3f8; font-weight: 500; }

  /* Headline and Identity */
  .hero-name { font-size: 30px; font-weight: 700; fill: #edf3f8; letter-spacing: -0.4px; }
  .hero-role { font-size: 13px; font-weight: 500; fill: #8fa6b8; letter-spacing: 0.2px; }
  .hero-desc { font-size: 12.5px; font-weight: 400; fill: #8fa6b8; }

  /* Primary Focus Chips */
  .chip-cv-txt  { font-size: 10.5px; font-weight: 600; fill: #edf3f8; letter-spacing: 0.5px; }
  .chip-rag-txt { font-size: 10.5px; font-weight: 600; fill: #edf3f8; letter-spacing: 0.5px; }

  /* Coding Signature Lines (Directly on Canvas) */
  .code-fn      { font-size: 11px; font-weight: 500; fill: #55a9c9; }
  .code-op      { font-size: 11px; fill: #536d80; }
  .code-str-cv  { font-size: 11px; fill: #edf3f8; }
  .code-str-rag { font-size: 11px; fill: #9384c5; }
  .code-dom     { font-size: 11px; font-weight: 500; fill: #55aa9e; }
  .code-dom-val { font-size: 11px; fill: #edf3f8; }
  .code-note    { font-size: 9.5px; font-weight: 400; fill: #557391; font-style: italic; }

  /* Right Floating Pipeline Labels */
  .stage-lbl { font-size: 9px; font-weight: 600; letter-spacing: 0.5px; text-anchor: middle; }
  .stage-sub { font-size: 8px; font-weight: 400; fill: #536d80; }

  /* Calm Keyframe Animations */
  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 95% { opacity: 0; }
    100% { opacity: 1; }
  }
  .cursor-anim { animation: blink 1.1s infinite; }

  @keyframes pulse-cv {
    0%, 100% { stroke-opacity: 0.55; }
    50% { stroke-opacity: 0.95; }
  }
  .cv-bracket { animation: pulse-cv 5s ease-in-out infinite; }

  @keyframes pulse-v {
    0%, 100% { transform: scale(1); opacity: 0.25; }
    50% { transform: scale(1.35); opacity: 0.65; }
  }
  .verify-glow {
    transform-origin: 760px 238px;
    animation: pulse-v 6s ease-in-out infinite;
  }
</style>

<!-- Canvas Base -->
<rect width="1000" height="330" rx="14" fill="url(#bg)"/>
<rect width="1000" height="330" rx="14" fill="url(#grid)"/>

<!-- ================= CELESTIAL ANCHOR (Upper Right Night Ocean Moon) ================= -->
<g transform="translate(920, 42)">
  <circle cx="0" cy="0" r="26" fill="url(#moon-glow)"/>
  <circle cx="0" cy="0" r="10" fill="#0d2438" stroke="#1d3b55" stroke-width="0.9"/>
  <path d="M 3,-9 A 10 10 0 0 1 3,9 A 8 8 0 0 0 3,-9 Z" fill="#1b364e"/>
</g>

<!-- ================= LEFT SIDE (Editorial and Developer Identity) ================= -->

<!-- 1. Single Authentic Terminal Line -->
<g transform="translate(56, 36)" class="mono">
  <text x="0" y="0">
    <tspan class="term-user">khoa@github</tspan><tspan class="term-sep">:</tspan><tspan class="term-path">~$ </tspan><tspan class="term-cmd">./init --research</tspan>
  </text>
  <!-- Blinking Cursor (1.1s) -->
  <rect x="226" y="-10" width="7" height="13" rx="1" fill="#55a9c9" class="cursor-anim"/>
</g>

<!-- 2. Headline Identity (Editorial, clean, no overlapping elements) -->
<text x="56" y="86" class="sans hero-name">Ph&#7841;m H&#7891;ng &#272;&#259;ng Khoa</text>

<!-- 3. Subtitle: Role and Primary Directions -->
<text x="56" y="114" class="mono hero-role">
  AI Systems Engineer
  <tspan fill="#536d80"> &#183; </tspan>
  <tspan fill="#55a9c9">Computer Vision</tspan>
  <tspan fill="#536d80"> &#183; </tspan>
  <tspan fill="#9384c5">Agentic-RAG</tspan>
</text>

<!-- 4. Research Statement -->
<text x="56" y="138" class="sans hero-desc">Building measurable, evidence-aware AI systems from research to real-world use.</text>

<!-- 5. Two Primary Focus Chips (Only Two, Restrained Accent) -->
<g transform="translate(56, 162)" class="mono">
  <!-- Chip 1: CV / OCR Systems -->
  <g>
    <rect width="154" height="28" rx="6" fill="#081726" fill-opacity="0.6" stroke="url(#chip-cv)" stroke-width="0.9"/>
    <!-- Minimal Reticle Icon -->
    <g transform="translate(10, 7)">
      <path d="M 0 4 L 0 0 L 4 0" fill="none" stroke="#55a9c9" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 10 0 L 14 0 L 14 4" fill="none" stroke="#55a9c9" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 0 10 L 0 14 L 4 14" fill="none" stroke="#55a9c9" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 10 14 L 14 14 L 14 10" fill="none" stroke="#55a9c9" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="7" cy="7" r="1.5" fill="#55a9c9"/>
    </g>
    <text x="34" y="18" class="chip-cv-txt">CV / OCR SYSTEMS</text>
  </g>

  <!-- Chip 2: Agentic-RAG / Evidence -->
  <g transform="translate(166, 0)">
    <rect width="194" height="28" rx="6" fill="#0f1124" fill-opacity="0.6" stroke="url(#chip-rag)" stroke-width="0.9"/>
    <!-- Minimal Tri-Node Network Icon -->
    <g transform="translate(10, 7)">
      <line x1="2" y1="12" x2="7" y2="3" stroke="#9384c5" stroke-width="1.1"/>
      <line x1="12" y1="12" x2="7" y2="3" stroke="#9384c5" stroke-width="1.1"/>
      <line x1="2" y1="12" x2="12" y2="12" stroke="#9384c5" stroke-width="1.1"/>
      <circle cx="7" cy="3" r="1.8" fill="#9384c5"/>
      <circle cx="2" cy="12" r="1.6" fill="#13172e" stroke="#9384c5" stroke-width="1"/>
      <circle cx="12" cy="12" r="1.6" fill="#13172e" stroke="#9384c5" stroke-width="1"/>
    </g>
    <text x="34" y="18" class="chip-rag-txt">AGENTIC-RAG / EVIDENCE</text>
  </g>
</g>

<!-- 6. Coding Signature Block (Idiomatic Python, Research Truth) -->
<g transform="translate(56, 230)" class="mono">
  <!-- Line 1 -->
  <text x="0" y="0">
    <tspan class="code-fn">research</tspan><tspan class="code-op">.</tspan><tspan class="code-fn">focus</tspan>
    <tspan class="code-op"> = [</tspan>
    <tspan class="code-str-cv">"computer_vision"</tspan><tspan class="code-op">, </tspan>
    <tspan class="code-str-rag">"agentic_rag"</tspan>
    <tspan class="code-op">]</tspan>
  </text>
  <!-- Line 2 -->
  <text x="0" y="19">
    <tspan class="code-fn">application</tspan><tspan class="code-op">.</tspan><tspan class="code-fn">domain</tspan>
    <tspan class="code-op"> = </tspan>
    <tspan class="code-dom-val">"healthcare_ai"</tspan>
  </text>
  <!-- Line 3 (Pythonic Comment) -->
  <text x="0" y="38" class="code-note">
    # pipeline: observe &#8594; retrieve &#8594; verify
  </text>
</g>

<!-- ================= RIGHT SIDE (Pure Floating Abstract Pipeline Motif) ================= -->
<!-- Floating cleanly along vertical axis x=760 with open negative space (>40%) -->
<g class="mono">

  <!-- Connecting Stream (x=760, subtle dashed stream) -->
  <line x1="760" y1="84" x2="760" y2="128" stroke="#163044" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="760" y1="184" x2="760" y2="222" stroke="#163044" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- TIER 1: OBSERVE (Abstract CV / OCR Feature Bounding) -->
  <g>
    <!-- Abstract Feature Bounding Box (No container border around stage) -->
    <g class="cv-bracket">
      <path d="M 726 50 L 720 50 L 720 56" fill="none" stroke="#55a9c9" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 794 50 L 800 50 L 800 56" fill="none" stroke="#55a9c9" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 720 74 L 720 80 L 726 80" fill="none" stroke="#55a9c9" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 800 74 L 800 80 L 794 80" fill="none" stroke="#55a9c9" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Subdued Internal Feature Signals -->
    <line x1="730" y1="60" x2="774" y2="60" stroke="#1c3b52" stroke-width="1"/>
    <line x1="730" y1="66" x2="784" y2="66" stroke="#142c40" stroke-width="1"/>
    <rect x="730" y="70" width="38" height="6" rx="2" fill="#0e2537" stroke="#254d6a" stroke-width="0.7"/>

    <!-- Text Label Centered Above Node -->
    <text x="760" y="42" class="stage-lbl" fill="#55a9c9">
      observe <tspan class="stage-sub">&#183; cv / ocr</tspan>
    </text>
  </g>

  <!-- TIER 2: RETRIEVE (Agentic Constellation: Orchestrator + Knowledge Nodes) -->
  <g>
    <!-- Graph Edges -->
    <line x1="760" y1="158" x2="736" y2="146" stroke="#2a2444" stroke-width="1.1"/>
    <line x1="760" y1="158" x2="784" y2="146" stroke="#2a2444" stroke-width="1.1"/>
    <line x1="760" y1="158" x2="760" y2="174" stroke="#233a44" stroke-width="1.1"/>

    <!-- Evidence Document Node (Left) -->
    <circle cx="736" cy="146" r="4" fill="#081726" stroke="#55a9c9" stroke-width="1"/>

    <!-- Parametric Knowledge Node (Right) -->
    <circle cx="784" cy="146" r="4" fill="#0f1124" stroke="#9384c5" stroke-width="1"/>

    <!-- Synthesizer Output Node (Bottom) -->
    <circle cx="760" cy="174" r="3.5" fill="#081d22" stroke="#55aa9e" stroke-width="1"/>

    <!-- Central Orchestrator Agent Node -->
    <circle cx="760" cy="158" r="7" fill="#18142c" stroke="#9384c5" stroke-width="1.5"/>
    <circle cx="760" cy="158" r="2.5" fill="#edf3f8"/>

    <!-- Text Label Centered Above Node -->
    <text x="760" y="132" class="stage-lbl" fill="#9384c5">
      retrieve <tspan class="stage-sub">&#183; multi-agent rag</tspan>
    </text>
  </g>

  <!-- TIER 3: VERIFY (Evidence-Grounded Anchor) -->
  <g>
    <!-- Soft Living Halo Pulse (6s duration) -->
    <circle cx="760" cy="238" r="14" fill="#2d6a62" class="verify-glow"/>

    <!-- Verification Badge Node -->
    <circle cx="760" cy="238" r="10" fill="#071b1f" stroke="#55aa9e" stroke-width="1.4"/>
    <path d="M 756.5 238 L 759 240.5 L 764.5 235.5" fill="none" stroke="#7be3d3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Text Label Centered Below Node -->
    <text x="760" y="264" class="stage-lbl" fill="#55aa9e">
      verify <tspan class="stage-sub">&#183; evidence grounded</tspan>
    </text>
  </g>

  <!-- UNIFIED DATA FLOW PARTICLE (Single flowing dot 8.5s: observe -> retrieve -> verify) -->
  <circle r="2.2" fill="#7be3d3">
    <animateMotion path="M 760 76 L 760 158 L 760 238" dur="8.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0; 0.95; 0.75; 0.95; 0" dur="8.5s" repeatCount="indefinite"/>
  </circle>

</g>

<!-- ================= BOTTOM OCEAN SIGNAL (Calm, Very Slow Ambient Horizon) ================= -->
<g>
  <!-- Distant Ocean Horizon Silhouette -->
  <path d="M 0 316 Q 280 298, 540 312 T 1000 306 L 1000 330 L 0 330 Z" fill="#081a29" opacity="0.22"/>

  <!-- Main Wave Line (18s slow drift, low opacity) -->
  <path d="M -100 318 Q 150 308, 400 318 T 900 312 T 1400 318" fill="none" stroke="#0e2a40" stroke-width="1.1" opacity="0.22">
    <animateTransform attributeName="transform" type="translate" values="0,0; -100,0; 0,0" dur="18s" repeatCount="indefinite"/>
  </path>

  <!-- Ghost Wave Line (20s slow counter-drift, low opacity) -->
  <path d="M -100 324 Q 200 316, 500 324 T 1000 320 T 1500 324" fill="none" stroke="#133d47" stroke-width="0.8" opacity="0.15">
    <animateTransform attributeName="transform" type="translate" values="0,0; 100,0; 0,0" dur="20s" repeatCount="indefinite"/>
  </path>
</g>

</svg>