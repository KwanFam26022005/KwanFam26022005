<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Pham Hong Dang Khoa - Healthcare AI, Agentic-RAG, and Computer Vision">
<defs>
  <linearGradient id="ocean-bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#051324"/>
    <stop offset="50%" stop-color="#0a233f"/>
    <stop offset="100%" stop-color="#06182c"/>
  </linearGradient>

  <linearGradient id="wave-teal" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0d9488" stop-opacity="0.4"/>
    <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#0f766e" stop-opacity="0.4"/>
  </linearGradient>

  <linearGradient id="wave-blue" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
    <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4"/>
  </linearGradient>

  <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e4e79"/>
    <stop offset="100%" stop-color="#123554"/>
  </linearGradient>
</defs>

<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .title { font-weight: 800; fill: #f8fafc; letter-spacing: -0.6px; }
  .subtitle { font-weight: 500; fill: #93c5fd; }
  .body { font-weight: 400; fill: #cbd5e1; }
  .pill-text { font-weight: 600; font-size: 11px; fill: #e0f2fe; }
  .card-title { font-weight: 700; font-size: 13.5px; fill: #f0f9ff; }
  .card-sub { font-weight: 500; font-size: 11.5px; fill: #94a3b8; }
  .card-tag { font-weight: 600; font-size: 10.5px; }

  /* CSS fallback animation */
  .css-heart { transform-box: fill-box; transform-origin: center; animation: pulseH 1.5s ease-in-out infinite; }
  @keyframes pulseH { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
</style>

<!-- Deep Ocean Canvas -->
<rect width="1000" height="380" rx="20" fill="url(#ocean-bg)"/>

<!-- 🌊 Living Ocean Waves (Animated via SMIL translate) -->
<g>
  <path d="M -80 280 Q 200 230, 480 280 T 1080 260 L 1080 380 L -80 380 Z" fill="url(#wave-blue)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -45,0; 0,0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M -80 280 Q 200 230, 480 280 T 1080 260" fill="none" stroke="#38bdf8" stroke-width="1.3" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" values="0,0; -45,0; 0,0" dur="9s" repeatCount="indefinite"/>
  </path>
</g>
<g>
  <path d="M -80 305 Q 220 260, 500 305 T 1080 290 L 1080 380 L -80 380 Z" fill="url(#wave-teal)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 45,0; 0,0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path d="M -80 305 Q 220 260, 500 305 T 1080 290" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0; 45,0; 0,0" dur="11s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Profile Identity Header -->
<g transform="translate(56 36)" class="sans">
  <!-- Topic Badges -->
  <g>
    <rect width="132" height="25" rx="12.5" fill="#0c2a47" stroke="#1d4d77"/>
    <circle cx="14" cy="12.5" r="3.5" fill="#38bdf8"/>
    <text x="25" y="16.5" class="pill-text">Ocean &amp; Deep Navy</text>

    <g transform="translate(142 0)">
      <rect width="112" height="25" rx="12.5" fill="#0c2a47" stroke="#1d4d77"/>
      <circle cx="14" cy="12.5" r="3.5" fill="#14b8a6"/>
      <text x="25" y="16.5" class="pill-text">Healthcare AI</text>
    </g>

    <g transform="translate(264 0)">
      <rect width="112" height="25" rx="12.5" fill="#0c2a47" stroke="#1d4d77"/>
      <circle cx="14" cy="12.5" r="3.5" fill="#818cf8"/>
      <text x="25" y="16.5" class="pill-text">Agentic-RAG</text>
    </g>

    <g transform="translate(386 0)">
      <rect width="128" height="25" rx="12.5" fill="#0c2a47" stroke="#1d4d77"/>
      <circle cx="14" cy="12.5" r="3.5" fill="#38bdf8"/>
      <text x="25" y="16.5" class="pill-text">Computer Vision</text>
    </g>
  </g>

  <!-- Name -->
  <text y="68" font-size="36" class="title">Phạm Hồng Đăng Khoa</text>
  
  <!-- Subtitle -->
  <text y="97" font-size="15" class="subtitle">AI Systems Engineer · Healthcare AI · Agentic-RAG · Computer Vision</text>
  
  <!-- Philosophy statement -->
  <text y="125" font-size="12.5" class="body">Developing verifiable, evidence-grounded AI architectures with oceanic calm and clinical precision.</text>
</g>

<!-- Triple Animated Focus Cards -->
<g transform="translate(56 195)" class="sans">

  <!-- ================= 1. HEALTHCARE AI CARD ================= -->
  <g>
    <rect width="282" height="120" rx="14" fill="#091f36" fill-opacity="0.92" stroke="url(#card-border)"/>
    <line x1="0" y1="18" x2="0" y2="102" stroke="#14b8a6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 🩺 ANIMATED HEALTHCARE ICON (Heartbeat + Dynamic ECG Wave) -->
    <g transform="translate(18 14)">
      <!-- Pulsing Medical Cross Badge -->
      <g transform="translate(14, 12)">
        <g class="css-heart">
          <rect x="-3" y="-9" width="6" height="18" rx="2" fill="#14b8a6"/>
          <rect x="-9" y="-3" width="18" height="6" rx="2" fill="#14b8a6"/>
          <animateTransform attributeName="transform" type="scale" values="1; 1.25; 1; 1.15; 1" dur="1.4s" repeatCount="indefinite"/>
        </g>
      </g>
      
      <!-- Flowing ECG Heartbeat Wave -->
      <path d="M 36 12 L 48 12 L 52 5 L 57 20 L 62 3 L 66 16 L 70 12 L 96 12" fill="none" stroke="#14b8a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80">
        <animate attributeName="stroke-dashoffset" values="160; 0" dur="2s" repeatCount="indefinite"/>
      </path>
      <!-- Glowing ECG Pulse Dot -->
      <circle cx="62" cy="3" r="3" fill="#2dd4bf">
        <animate attributeName="r" values="2; 4.5; 2" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(18 58)">
      <text class="card-title">Healthcare AI</text>
      <text y="20" class="card-sub">Clinical NLU &amp; EHR Mining</text>
      <text y="40" class="card-tag" fill="#2dd4bf">Medical-NLU · Evidence-RAG</text>
    </g>
  </g>

  <!-- ================= 2. AGENTIC-RAG CARD ================= -->
  <g transform="translate(303 0)">
    <rect width="282" height="120" rx="14" fill="#091f36" fill-opacity="0.92" stroke="url(#card-border)"/>
    <line x1="0" y1="18" x2="0" y2="102" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 🧠 ANIMATED AGENTIC-RAG ICON (3-Agent Rotating Orbit + Core) -->
    <g transform="translate(18 14)">
      <!-- Pulsing Knowledge Core -->
      <circle cx="26" cy="14" r="5" fill="#818cf8">
        <animate attributeName="r" values="4; 6.5; 4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- 3-Node Rotating Orbit Track -->
      <g transform="translate(26, 14)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
        <g>
          <!-- Agent 1: Query (Cyan) -->
          <circle cx="0" cy="-14" r="3.2" fill="#38bdf8"/>
          <!-- Agent 2: Retrieval (Teal) -->
          <circle cx="12.1" cy="7" r="3.2" fill="#14b8a6"/>
          <!-- Agent 3: Fact Verification (Purple) -->
          <circle cx="-12.1" cy="7" r="3.2" fill="#c084fc"/>
          <!-- Continuous 360 Rotation -->
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- Animated Verification Rays -->
      <line x1="52" y1="14" x2="94" y2="14" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3">
        <animate attributeName="stroke-dashoffset" values="14; 0" dur="1.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <g transform="translate(18 58)">
      <text class="card-title">Agentic-RAG</text>
      <text y="20" class="card-sub">Multi-Agent &amp; Fact Auditing</text>
      <text y="40" class="card-tag" fill="#a5b4fc">Citation Gates · Anti-Hallucination</text>
    </g>
  </g>

  <!-- ================= 3. COMPUTER VISION CARD ================= -->
  <g transform="translate(606 0)">
    <rect width="282" height="120" rx="14" fill="#091f36" fill-opacity="0.92" stroke="url(#card-border)"/>
    <line x1="0" y1="18" x2="0" y2="102" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 👁️ ANIMATED COMPUTER VISION ICON (Reticle Breathing &amp; Laser Scan) -->
    <g transform="translate(18 14)">
      <!-- Reticle 4 Corners Expanding &amp; Locking -->
      <g transform="translate(24, 14)">
        <g>
          <!-- Top-Left Bracket -->
          <path d="M -10 -4 L -14 -4 L -14 -8 L -10 -8" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <!-- Top-Right Bracket -->
          <path d="M 10 -4 L 14 -4 L 14 -8 L 10 -8" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <!-- Bottom-Left Bracket -->
          <path d="M -10 12 L -14 12 L -14 16 L -10 16" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <!-- Bottom-Right Bracket -->
          <path d="M 10 12 L 14 12 L 14 16 L 10 16" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <!-- Breathing scale animation -->
          <animateTransform attributeName="transform" type="scale" values="1; 1.25; 1" dur="2.2s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- Center Optical Sensor Iris -->
      <circle cx="24" cy="18" r="4.5" fill="#38bdf8">
        <animate attributeName="r" values="3.5; 6; 3.5" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="24" cy="18" r="9" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

      <!-- Vertical Laser Scanning Line -->
      <line x1="12" y1="8" x2="36" y2="8" stroke="#7dd3fc" stroke-width="1.4" opacity="0.8">
        <animate attributeName="y1" values="8; 26; 8" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="8; 26; 8" dur="2.2s" repeatCount="indefinite"/>
      </line>
    </g>

    <g transform="translate(18 58)">
      <text class="card-title">Computer Vision</text>
      <text y="20" class="card-sub">Document OCR &amp; Inspection</text>
      <text y="40" class="card-tag" fill="#7dd3fc">PP-OCRv6 · Invoice-engine</text>
    </g>
  </g>

</g>
</svg>
