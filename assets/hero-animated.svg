<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-label="Pham Hong Dang Khoa - Healthcare AI, Agentic-RAG, Computer Vision">
<defs>
  <!-- Background Deep Navy Gradient -->
  <linearGradient id="deep-navy-sky" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#040e1b"/>
    <stop offset="40%" stop-color="#06182c"/>
    <stop offset="75%" stop-color="#08233e"/>
    <stop offset="100%" stop-color="#031122"/>
  </linearGradient>

  <!-- Luminous Moon Gradient -->
  <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ccfbf1"/>
    <stop offset="45%" stop-color="#5eead4"/>
    <stop offset="80%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
  </radialGradient>

  <!-- Ambient Moon Aura -->
  <radialGradient id="moon-aura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
    <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#08233e" stop-opacity="0"/>
  </radialGradient>

  <!-- Mountain Silhouette Gradients -->
  <linearGradient id="mountain-far" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#092036" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#051424"/>
  </linearGradient>

  <linearGradient id="mountain-near" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0b2844"/>
    <stop offset="100%" stop-color="#030d1a"/>
  </linearGradient>

  <!-- Card Background & Border Gradients -->
  <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0a2139" stop-opacity="0.92"/>
    <stop offset="100%" stop-color="#06182a" stop-opacity="0.95"/>
  </linearGradient>

  <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1b4d75"/>
    <stop offset="100%" stop-color="#0e2f4c"/>
  </linearGradient>

  <!-- Bottom Bar Gradient -->
  <linearGradient id="footer-bar-bg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#061628" stop-opacity="0.96"/>
    <stop offset="50%" stop-color="#09223c" stop-opacity="0.98"/>
    <stop offset="100%" stop-color="#061628" stop-opacity="0.96"/>
  </linearGradient>
</defs>

<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* Atmospheric text styles */
  .code-top { font-size: 11.5px; fill: #5eead4; letter-spacing: 0.5px; }
  .side-quote { font-size: 9px; font-weight: 600; fill: #4a7296; letter-spacing: 2px; line-height: 1.4; }
  .side-script { font-size: 10px; fill: #6490b6; letter-spacing: 1px; }

  /* Main text styles */
  .hero-name { font-size: 38px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
  .hero-sub { font-size: 14.5px; font-weight: 500; fill: #93c5fd; }
  .hero-desc { font-size: 12.5px; font-weight: 400; fill: #8da4be; }

  /* Card typography */
  .num-tag { font-size: 10px; font-weight: 600; fill: #527a9e; }
  .c-title { font-size: 14px; font-weight: 700; fill: #f0f9ff; }
  .c-sub { font-size: 11.5px; font-weight: 400; fill: #8ca4bd; }
  .c-tags { font-size: 11px; font-weight: 600; }
  .arrow { font-size: 13px; font-weight: 600; fill: #527a9e; }

  /* Footer bar typography */
  .bar-label { font-size: 10.5px; font-weight: 700; fill: #648dae; letter-spacing: 1.5px; }
  .bar-val { font-size: 10.5px; font-weight: 600; fill: #d8eefe; letter-spacing: 1.2px; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="425" rx="18" fill="url(#deep-navy-sky)"/>

<!-- ================= BACKGROUND SCENERY (Ocean Moonrise) ================= -->

<!-- Distant Mountain Silhouettes -->
<path d="M 520 180 Q 640 125, 760 165 T 1000 145 L 1000 240 L 520 240 Z" fill="url(#mountain-far)" opacity="0.65"/>
<path d="M 440 210 Q 580 155, 720 185 T 1000 170 L 1000 240 L 440 240 Z" fill="url(#mountain-near)" opacity="0.85"/>

<!-- Ambient Moon Halo Aura -->
<circle cx="880" cy="142" r="90" fill="url(#moon-aura)">
  <animate attributeName="r" values="85; 95; 85" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.7; 1; 0.7" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- Rising Glowing Moon Orb -->
<circle cx="880" cy="142" r="38" fill="url(#moon-glow)">
  <animate attributeName="opacity" values="0.88; 1; 0.88" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- Shimmering Moonlit Ocean Surface Ripples -->
<g opacity="0.75">
  <ellipse cx="880" cy="186" rx="42" ry="2.2" fill="#5eead4">
    <animate attributeName="rx" values="38; 46; 38" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="880" cy="193" rx="55" ry="2.5" fill="#38bdf8">
    <animate attributeName="rx" values="50; 60; 50" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5; 0.9; 0.5" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="875" cy="200" rx="70" ry="2.8" fill="#2dd4bf">
    <animate attributeName="rx" values="64; 76; 64" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4; 0.85; 0.4" dur="4.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="865" cy="208" rx="90" ry="3" fill="#0284c7">
    <animate attributeName="rx" values="82; 98; 82" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35; 0.75; 0.35" dur="4.8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="850" cy="216" rx="110" ry="3.2" fill="#0369a1" opacity="0.4"/>
</g>

<!-- Graceful Ambient Sea Swell Waves in Background -->
<path d="M 0 320 Q 250 285, 500 320 T 1000 305" fill="none" stroke="#123e66" stroke-width="1.2" opacity="0.4">
  <animateTransform attributeName="transform" type="translate" values="0,0; -30,0; 0,0" dur="8s" repeatCount="indefinite"/>
</path>
<path d="M 0 338 Q 260 305, 520 338 T 1000 325" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.3">
  <animateTransform attributeName="transform" type="translate" values="0,0; 30,0; 0,0" dur="10s" repeatCount="indefinite"/>
</path>

<!-- ================= ATMOSPHERIC POETIC TYPOGRAPHY ================= -->

<!-- Top Right Vertical Poem / Creed -->
<g transform="translate(915 28)" class="mono side-quote">
  <text y="0">CALM</text>
  <text y="13">CODE</text>
  <text y="26">DEEP WORK</text>
  <text y="39">BETTER AI</text>
</g>

<!-- Mid Right Narrative (Near Moon) -->
<g transform="translate(755 96)" class="mono side-script">
  <text y="0">ideas</text>
  <text y="13">to</text>
  <text y="26">impact</text>
  <text y="39">/</text>
</g>

<!-- Lower Right Ocean Principles -->
<g transform="translate(845 336)" class="mono side-quote">
  <text y="0">OCEANIC CALM</text>
  <text y="13">CLINICAL PRECISION</text>
  <text y="26">REAL-WORLD IMPACT</text>
</g>

<!-- ================= TOP CODE LINE ================= -->
<g transform="translate(42 34)" class="mono">
  <text class="code-top">&gt; build(ideas) <tspan fill="#94a3b8">-&gt;</tspan> real_world_impact();</text>
  <!-- Blinking Cursor Block -->
  <rect x="238" y="-10" width="7.5" height="13" fill="#5eead4" rx="1">
    <animate attributeName="opacity" values="1; 0; 1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- ================= 3 SPECIALIZATION PILLS ================= -->
<g transform="translate(42 58)" class="sans">
  <!-- Pill 1: Healthcare AI -->
  <g>
    <rect width="122" height="26" rx="13" fill="#072036" stroke="#14b8a6" stroke-width="1.1"/>
    <!-- Medical Cross Icon -->
    <g transform="translate(14 8)">
      <rect x="3" y="0" width="3.5" height="10" rx="1" fill="#14b8a6"/>
      <rect x="0" y="3.2" width="9.5" height="3.5" rx="1" fill="#14b8a6"/>
    </g>
    <text x="29" y="17" class="pill-text">Healthcare AI</text>
  </g>

  <!-- Pill 2: Agentic-RAG -->
  <g transform="translate(132 0)">
    <rect width="118" height="26" rx="13" fill="#072036" stroke="#818cf8" stroke-width="1.1"/>
    <!-- Connected 3-Node Icon -->
    <g transform="translate(14 8)">
      <circle cx="4.5" cy="2" r="2" fill="#818cf8"/>
      <circle cx="1" cy="8" r="2" fill="#818cf8"/>
      <circle cx="8" cy="8" r="2" fill="#818cf8"/>
      <line x1="4.5" y1="2" x2="1" y2="8" stroke="#818cf8" stroke-width="0.9"/>
      <line x1="4.5" y1="2" x2="8" y2="8" stroke="#818cf8" stroke-width="0.9"/>
      <line x1="1" y1="8" x2="8" y2="8" stroke="#818cf8" stroke-width="0.9"/>
    </g>
    <text x="29" y="17" class="pill-text">Agentic-RAG</text>
  </g>

  <!-- Pill 3: Computer Vision -->
  <g transform="translate(260 0)">
    <rect width="138" height="26" rx="13" fill="#072036" stroke="#38bdf8" stroke-width="1.1"/>
    <!-- Eye Icon -->
    <g transform="translate(14 9)">
      <circle cx="5" cy="4" r="4.2" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="5" cy="4" r="1.8" fill="#38bdf8"/>
    </g>
    <text x="28" y="17" class="pill-text">Computer Vision</text>
  </g>
</g>

<!-- ================= MAIN IDENTITY ================= -->
<g transform="translate(42 128)" class="sans">
  <!-- Name with Glowing Cyan Cursor -->
  <g>
    <text class="hero-name">Phạm Hồng Đăng Khoa</text>
    <!-- Cyan Cursor Bar -->
    <rect x="474" y="-30" width="3" height="34" fill="#38bdf8" rx="1.5">
      <animate attributeName="opacity" values="1; 0.15; 1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Subtitle -->
  <text y="28" class="hero-sub">AI Systems Engineer · Healthcare AI · Agentic-RAG · Computer Vision</text>

  <!-- Description Statement -->
  <text y="52" class="hero-desc">Developing verifiable, evidence-grounded AI architectures with oceanic calm and clinical precision.</text>
</g>

<!-- ================= 3 FEATURED CARDS (01, 02, 03) ================= -->
<g transform="translate(42 206)" class="sans">

  <!-- CARD 01: HEALTHCARE AI -->
  <g>
    <!-- Background Panel -->
    <rect width="298" height="104" rx="14" fill="url(#card-bg)" stroke="url(#card-border)"/>
    <text x="278" y="24" text-anchor="end" class="mono num-tag">01</text>

    <!-- Icon Box with Glowing Teal Border -->
    <g transform="translate(16 16)">
      <rect width="40" height="40" rx="10" fill="#062238" stroke="#14b8a6" stroke-width="1.4"/>
      
      <!-- Pulsing Medical Cross Inside Box -->
      <g transform="translate(20 20)">
        <g>
          <rect x="-3" y="-9" width="6" height="18" rx="1.5" fill="#14b8a6"/>
          <rect x="-9" y="-3" width="18" height="6" rx="1.5" fill="#14b8a6"/>
          <!-- SMIL Heartbeat Pulse -->
          <animateTransform attributeName="transform" type="scale" values="1; 1.25; 1; 1.15; 1" dur="1.4s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- Content -->
    <g transform="translate(68 28)">
      <text class="c-title">Healthcare AI</text>
      <text y="18" class="c-sub">Clinical NLU &amp; EHR Mining</text>
      <text y="38" class="c-tags" fill="#2dd4bf">Medical-NLU · Evidence-RAG</text>
    </g>
    <text x="278" y="70" class="arrow">→</text>
  </g>

  <!-- CARD 02: AGENTIC-RAG -->
  <g transform="translate(310 0)">
    <!-- Background Panel -->
    <rect width="298" height="104" rx="14" fill="url(#card-bg)" stroke="url(#card-border)"/>
    <text x="278" y="24" text-anchor="end" class="mono num-tag">02</text>

    <!-- Icon Box with Glowing Violet Border -->
    <g transform="translate(16 16)">
      <rect width="40" height="40" rx="10" fill="#0a1d3a" stroke="#818cf8" stroke-width="1.4"/>

      <!-- Rotating Multi-Agent Constellation Inside Box -->
      <g transform="translate(20 20)">
        <!-- Center Knowledge Core -->
        <circle cx="0" cy="0" r="3.5" fill="#818cf8"/>
        <!-- Rotating Orbit -->
        <g>
          <circle cx="0" cy="-9" r="2.8" fill="#38bdf8"/>
          <circle cx="8" cy="5" r="2.8" fill="#14b8a6"/>
          <circle cx="-8" cy="5" r="2.8" fill="#c084fc"/>
          <line x1="0" y1="-9" x2="8" y2="5" stroke="#818cf8" stroke-width="0.8" opacity="0.6"/>
          <line x1="8" y1="5" x2="-8" y2="5" stroke="#818cf8" stroke-width="0.8" opacity="0.6"/>
          <line x1="-8" y1="5" x2="0" y2="-9" stroke="#818cf8" stroke-width="0.8" opacity="0.6"/>
          <!-- SMIL Continuous Orbit Rotation -->
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- Content -->
    <g transform="translate(68 28)">
      <text class="c-title">Agentic-RAG</text>
      <text y="18" class="c-sub">Multi-Agent &amp; Fact Auditing</text>
      <text y="38" class="c-tags" fill="#a5b4fc">Citation Gates · Anti-Hallucination</text>
    </g>
    <text x="278" y="70" class="arrow">→</text>
  </g>

  <!-- CARD 03: COMPUTER VISION -->
  <g transform="translate(620 0)">
    <!-- Background Panel -->
    <rect width="298" height="104" rx="14" fill="url(#card-bg)" stroke="url(#card-border)"/>
    <text x="278" y="24" text-anchor="end" class="mono num-tag">03</text>

    <!-- Icon Box with Glowing Cyan Border -->
    <g transform="translate(16 16)">
      <rect width="40" height="40" rx="10" fill="#062238" stroke="#38bdf8" stroke-width="1.4"/>

      <!-- Bounding-Box Reticle & Laser Inside Box -->
      <g transform="translate(20 20)">
        <!-- 4 Corner Brackets (Breathing Focus) -->
        <g>
          <path d="M -8 -4 L -11 -4 L -11 -7 L -8 -7" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M 8 -4 L 11 -4 L 11 -7 L 8 -7" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M -8 8 L -11 8 L -11 11 L -8 11" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M 8 8 L 11 8 L 11 11 L 8 11" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
          <!-- SMIL Focus Breathing -->
          <animateTransform attributeName="transform" type="scale" values="1; 1.25; 1" dur="2.2s" repeatCount="indefinite"/>
        </g>
        <!-- Center Optical Sensor Iris -->
        <circle cx="0" cy="2" r="3.2" fill="#38bdf8">
          <animate attributeName="r" values="2.8; 4.8; 2.8" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <!-- Vertical Scanning Laser -->
        <line x1="-9" y1="-6" x2="9" y2="-6" stroke="#7dd3fc" stroke-width="1.2" opacity="0.8">
          <animate attributeName="y1" values="-6; 10; -6" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="-6; 10; -6" dur="2.2s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>

    <!-- Content -->
    <g transform="translate(68 28)">
      <text class="c-title">Computer Vision</text>
      <text y="18" class="c-sub">Document OCR &amp; Inspection</text>
      <text y="38" class="c-tags" fill="#7dd3fc">PP-OCRv6 · Invoice-engine</text>
    </g>
    <text x="278" y="70" class="arrow">→</text>
  </g>

</g>

<!-- ================= BOTTOM CONTACT BAR (Integrated Glassmorphic Bar) ================= -->
<g transform="translate(20 358)" class="mono">
  <!-- Rounded Glass Bar -->
  <rect width="960" height="46" rx="14" fill="url(#footer-bar-bg)" stroke="#163f66" stroke-width="1.1"/>

  <!-- Segment 1: LinkedIn -->
  <g transform="translate(38 27)">
    <text class="bar-label">LINKEDIN</text>
    <line x1="72" y1="-14" x2="72" y2="4" stroke="#1a4d79" stroke-width="1"/>
    <text x="94" class="bar-val">PHAM HONG DANG KHOA</text>
  </g>

  <!-- Segment 2: Email -->
  <g transform="translate(365 27)">
    <text class="bar-label">EMAIL</text>
    <line x1="52" y1="-14" x2="52" y2="4" stroke="#1a4d79" stroke-width="1"/>
    <text x="74" class="bar-val">PHDK2602@GMAIL.COM</text>
  </g>

  <!-- Segment 3: Location -->
  <g transform="translate(695 27)">
    <text class="bar-label">LOCATION</text>
    <line x1="75" y1="-14" x2="75" y2="4" stroke="#1a4d79" stroke-width="1"/>
    <text x="96" class="bar-val">HO CHI MINH CITY</text>
  </g>
</g>

</svg>
