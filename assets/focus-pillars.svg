<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Healthcare AI and Vision Pillars Architecture">
<defs>
  <radialGradient id="ocean-pillars-bg" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="#0b2442"/>
    <stop offset="100%" stop-color="#041426"/>
  </radialGradient>
</defs>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .node-health { fill: #0a243e; stroke: #14b8a6; stroke-width: 1.2; }
  .node-vision { fill: #0a243e; stroke: #38bdf8; stroke-width: 1.2; }
  .flow-health { stroke: #14b8a6; stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; opacity: 0.75; }
  .flow-vision { stroke: #38bdf8; stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; opacity: 0.75; }
</style>

<rect width="960" height="320" rx="18" fill="url(#ocean-pillars-bg)"/>
<rect x="14" y="14" width="932" height="292" rx="14" fill="#06192e" stroke="#163e66"/>

<!-- Column 1: Healthcare AI & Clinical Informatics -->
<g transform="translate(32 30)">
  <!-- Header with Medical Cross -->
  <rect width="424" height="42" rx="10" fill="#082a47" stroke="#14b8a655"/>
  <g transform="translate(18 16)">
    <rect x="3" y="0" width="4" height="10" rx="1.5" fill="#14b8a6"/>
    <rect x="0" y="3" width="10" height="4" rx="1.5" fill="#14b8a6"/>
  </g>
  <text x="36" y="25" class="mono" font-size="11" font-weight="700" letter-spacing="1.5px" fill="#14b8a6">PILLAR A: HEALTHCARE AI &amp; CLINICAL NLU</text>

  <!-- Flow Steps -->
  <!-- Step 1 -->
  <g transform="translate(0 56)">
    <rect width="424" height="38" rx="8" class="node-health"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#f0f9ff">01 · Clinical Text Ingestion &amp; De-Identification</text>
    <text x="320" y="24" class="mono" font-size="10" fill="#2dd4bf">Pre-Filter</text>
  </g>
  <line x1="212" y1="94" x2="212" y2="108" class="flow-health"/>
  
  <!-- Step 2 -->
  <g transform="translate(0 108)">
    <rect width="424" height="38" rx="8" class="node-health"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#f0f9ff">02 · Medical-NLU Entity Extraction &amp; Benchmarks</text>
    <text x="322" y="24" class="mono" font-size="10" fill="#14b8a6">Inference</text>
  </g>
  <line x1="212" y1="146" x2="212" y2="160" class="flow-health"/>

  <!-- Step 3 -->
  <g transform="translate(0 160)">
    <rect width="424" height="38" rx="8" class="node-health"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#f0f9ff">03 · Evidence-Verified Medical Guideline RAG</text>
    <text x="328" y="24" class="mono" font-size="10" fill="#5eead4">Auditing</text>
  </g>
  <line x1="212" y1="198" x2="212" y2="212" class="flow-health"/>

  <!-- Step 4 -->
  <g transform="translate(0 212)">
    <rect width="424" height="38" rx="8" class="node-health"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#f0f9ff">04 · Grounded Clinical Answers with Citations</text>
    <text x="325" y="24" class="mono" font-size="10" fill="#14b8a6">Synthesis</text>
  </g>
</g>

<!-- Column Divider -->
<line x1="480" y1="30" x2="480" y2="290" stroke="#163e66" stroke-dasharray="4 6"/>

<!-- Column 2: Vision & Document Intelligence -->
<g transform="translate(504 30)">
  <!-- Header with Vision Icon -->
  <rect width="424" height="42" rx="10" fill="#082a47" stroke="#38bdf855"/>
  <g transform="translate(18 16)">
    <circle cx="5" cy="5" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.3"/>
    <circle cx="5" cy="5" r="2" fill="#38bdf8"/>
  </g>
  <text x="36" y="25" class="mono" font-size="11" font-weight="700" letter-spacing="1.5px" fill="#38bdf8">PILLAR B: VISION &amp; DOCUMENT SYSTEMS</text>

  <!-- Flow Steps -->
  <!-- Step 1 -->
  <g transform="translate(0 56)">
    <rect width="424" height="38" rx="8" class="node-vision"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#f0f9ff">01 · Document Intake &amp; Geometry Rectification</text>
    <text x="325" y="24" class="mono" font-size="10" fill="#38bdf8">Intake</text>
  </g>
  <line x1="212" y1="94" x2="212" y2="108" class="flow-vision"/>

  <!-- Step 2 -->
  <g transform="translate(0 108)">
    <rect width="424" height="38" rx="8" class="node-vision"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#f0f9ff">02 · PP-OCRv6 Localization &amp; Recognition Core</text>
    <text x="325" y="24" class="mono" font-size="10" fill="#38bdf8">OCR Core</text>
  </g>
  <line x1="212" y1="146" x2="212" y2="160" class="flow-vision"/>

  <!-- Step 3 -->
  <g transform="translate(0 160)">
    <rect width="424" height="38" rx="8" class="node-vision"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#f0f9ff">03 · Invoice-engine Deterministic Validation</text>
    <text x="328" y="24" class="mono" font-size="10" fill="#7dd3fc">Validation</text>
  </g>
  <line x1="212" y1="198" x2="212" y2="212" class="flow-vision"/>

  <!-- Step 4 -->
  <g transform="translate(0 212)">
    <rect width="424" height="38" rx="8" class="node-vision"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#f0f9ff">04 · Fail-Closed FastAPI Service &amp; Inspection UI</text>
    <text x="320" y="24" class="mono" font-size="10" fill="#38bdf8">Delivery</text>
  </g>
</g>
</svg>
