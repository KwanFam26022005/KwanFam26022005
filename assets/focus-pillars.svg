<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Core Research Pillars Architecture">
<defs>
  <radialGradient id="pillars-bg" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#0b1626"/>
    <stop offset="100%" stop-color="#060e1a"/>
  </radialGradient>
</defs>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .node-cv { fill: #0f1c2e; stroke: #38bdf8; stroke-width: 1.2; }
  .node-rag { fill: #18152e; stroke: #8b5cf6; stroke-width: 1.2; }
  .flow-cv { stroke: #38bdf8; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; opacity: 0.7; }
  .flow-rag { stroke: #8b5cf6; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; opacity: 0.7; }
</style>

<rect width="960" height="320" rx="18" fill="url(#pillars-bg)"/>
<rect x="14" y="14" width="932" height="292" rx="14" fill="#07111f" stroke="#1e293b"/>

<!-- Column 1: Computer Vision & OCR Systems -->
<g transform="translate(32 30)">
  <!-- Header -->
  <rect width="424" height="42" rx="10" fill="#0b1a2c" stroke="#38bdf844"/>
  <circle cx="20" cy="21" r="5" fill="#38bdf8"/>
  <text x="34" y="25" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.5px" fill="#38bdf8">PILLAR A: COMPUTER VISION / OCR PIPELINES</text>

  <!-- Flow Steps -->
  <!-- Step 1 -->
  <g transform="translate(0 56)">
    <rect width="424" height="38" rx="8" class="node-cv"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#e5eefb">01 · Quality Gating &amp; Geometry Rectification</text>
    <text x="310" y="24" class="mono" font-size="10" fill="#38bdf8">Pre-Filter</text>
  </g>
  <line x1="212" y1="94" x2="212" y2="108" class="flow-cv"/>
  
  <!-- Step 2 -->
  <g transform="translate(0 108)">
    <rect width="424" height="38" rx="8" class="node-cv"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#e5eefb">02 · PP-OCRv6 Text Localization &amp; Recognition</text>
    <text x="312" y="24" class="mono" font-size="10" fill="#38bdf8">Inference</text>
  </g>
  <line x1="212" y1="146" x2="212" y2="160" class="flow-cv"/>

  <!-- Step 3 -->
  <g transform="translate(0 160)">
    <rect width="424" height="38" rx="8" class="node-cv"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#e5eefb">03 · Deterministic Decision &amp; Verification Gate</text>
    <text x="325" y="24" class="mono" font-size="10" fill="#2dd4bf">Validation</text>
  </g>
  <line x1="212" y1="198" x2="212" y2="212" class="flow-cv"/>

  <!-- Step 4 -->
  <g transform="translate(0 212)">
    <rect width="424" height="38" rx="8" class="node-cv"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#e5eefb">04 · Fail-Closed FastAPI Service &amp; Telemetry</text>
    <text x="315" y="24" class="mono" font-size="10" fill="#38bdf8">Production</text>
  </g>
</g>

<!-- Column Divider -->
<line x1="480" y1="30" x2="480" y2="290" stroke="#1e293b" stroke-dasharray="4 6"/>

<!-- Column 2: Agentic-RAG & Evidence-Verified AI -->
<g transform="translate(504 30)">
  <!-- Header -->
  <rect width="424" height="42" rx="10" fill="#1b122e" stroke="#8b5cf644"/>
  <circle cx="20" cy="21" r="5" fill="#8b5cf6"/>
  <text x="34" y="25" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.5px" fill="#8b5cf6">PILLAR B: AGENTIC-RAG &amp; EVIDENCE VERIFICATION</text>

  <!-- Flow Steps -->
  <!-- Step 1 -->
  <g transform="translate(0 56)">
    <rect width="424" height="38" rx="8" class="node-rag"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#e5eefb">01 · Intent Routing &amp; Query Decomposition</text>
    <text x="330" y="24" class="mono" font-size="10" fill="#8b5cf6">Planning</text>
  </g>
  <line x1="212" y1="94" x2="212" y2="108" class="flow-rag"/>

  <!-- Step 2 -->
  <g transform="translate(0 108)">
    <rect width="424" height="38" rx="8" class="node-rag"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#e5eefb">02 · Hybrid Dense/Sparse Corrective Retrieval</text>
    <text x="338" y="24" class="mono" font-size="10" fill="#8b5cf6">Retrieval</text>
  </g>
  <line x1="212" y1="146" x2="212" y2="160" class="flow-rag"/>

  <!-- Step 3 -->
  <g transform="translate(0 160)">
    <rect width="424" height="38" rx="8" class="node-rag"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#e5eefb">03 · Citation Audit &amp; Hallucination Barrier</text>
    <text x="328" y="24" class="mono" font-size="10" fill="#c084fc">Auditing</text>
  </g>
  <line x1="212" y1="198" x2="212" y2="212" class="flow-rag"/>

  <!-- Step 4 -->
  <g transform="translate(0 212)">
    <rect width="424" height="38" rx="8" class="node-rag"/>
    <text x="16" y="24" class="sans" font-size="12" font-weight="700" fill="#e5eefb">04 · Grounded Synthesis with Attributed Citations</text>
    <text x="325" y="24" class="mono" font-size="10" fill="#8b5cf6">Synthesis</text>
  </g>
</g>
</svg>
