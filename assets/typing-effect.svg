<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 48" width="960" height="48" role="img" aria-label="Dynamic Role and Expertise Typing Animation">
<defs>
  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .prompt-text {
      font-size: 13px;
      font-weight: 700;
      fill: #0969da;
      letter-spacing: 0.3px;
    }
    .type-text {
      font-size: 13px;
      font-weight: 600;
      fill: #0f172a;
      letter-spacing: 0.2px;
    }
    @keyframes cursor-blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .blinking-cursor {
      animation: cursor-blink 0.9s infinite;
      fill: #0969da;
    }
  </style>

  <!-- Animated paths for text revealing (typewriter effect) -->
  <path id="p0">
    <animate id="d0" attributeName="d" begin="0s;d3.end" dur="4.2s" fill="remove"
      values="m 155,29 h 0 ; m 155,29 h 760 ; m 155,29 h 760 ; m 155,29 h 0"
      keyTimes="0; 0.38; 0.84; 1" />
  </path>

  <path id="p1">
    <animate id="d1" attributeName="d" begin="d0.end" dur="4.2s" fill="remove"
      values="m 155,29 h 0 ; m 155,29 h 760 ; m 155,29 h 760 ; m 155,29 h 0"
      keyTimes="0; 0.38; 0.84; 1" />
  </path>

  <path id="p2">
    <animate id="d2" attributeName="d" begin="d1.end" dur="4.2s" fill="remove"
      values="m 155,29 h 0 ; m 155,29 h 760 ; m 155,29 h 760 ; m 155,29 h 0"
      keyTimes="0; 0.38; 0.84; 1" />
  </path>

  <path id="p3">
    <animate id="d3" attributeName="d" begin="d2.end" dur="4.2s" fill="remove"
      values="m 155,29 h 0 ; m 155,29 h 760 ; m 155,29 h 760 ; m 155,29 h 0"
      keyTimes="0; 0.38; 0.84; 1" />
  </path>
</defs>

<!-- Outer Container -->
<rect width="960" height="48" rx="8" fill="#f8fafc" stroke="#d0d7de" stroke-width="1.2"/>

<!-- Terminal Command Prompt -->
<text x="22" y="29" class="mono prompt-text">khoa@github:~$</text>

<!-- Animated Typewriter Text Lines -->
<g class="mono">
  <text class="type-text">
    <textPath href="#p0" xlink:href="#p0">AI Systems Engineer · Computer Vision · Agentic-RAG</textPath>
  </text>
  <text class="type-text">
    <textPath href="#p1" xlink:href="#p1">Computer Vision &amp; Production OCR Pipelines</textPath>
  </text>
  <text class="type-text">
    <textPath href="#p2" xlink:href="#p2">Agentic-RAG &amp; Evidence Grounded AI Systems</textPath>
  </text>
  <text class="type-text">
    <textPath href="#p3" xlink:href="#p3">Building Measurable AI Systems from Research to Real-World</textPath>
  </text>
</g>

<!-- Blinking Cursor -->
<rect x="926" y="16" width="7" height="16" rx="1" class="blinking-cursor"/>
</svg>
