<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Phạm Hồng Đăng Khoa — AI Systems Engineer focused on Computer Vision and Agentic-RAG">
<defs>
  <!-- Deep Oceanic Navy Base -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#040c16"/>
    <stop offset="50%" stop-color="#071320"/>
    <stop offset="100%" stop-color="#091b2c"/>
  </linearGradient>

  <!-- Restrained Specialization Borders -->
  <linearGradient id="chip-cv" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#55a9c9" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#3b7a94" stop-opacity="0.25"/>
  </linearGradient>

  <linearGradient id="chip-rag" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9384c5" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#695b96" stop-opacity="0.25"/>
  </linearGradient>

  <!-- Subtle Coordinate Matrix -->
  <pattern id="grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.65" fill="#203d54"/>
  </pattern>

  <!-- Grid Gradient Mask (softer on left text, clearer on right motif) -->
  <linearGradient id="grid-fade" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="45%" stop-color="#ffffff" stop-opacity="0.10"/>
    <stop offset="70%" stop-color="#ffffff" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
  </linearGradient>

  <mask id="grid-mask">
    <rect width="1000" height="330" fill="url(#grid-fade)"/>
  </mask>
</defs>

<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* Terminal Command Line */
  .term-user { font-size: 12px; fill: #55a9c9; font-weight: 600; }
  .term-sep  { font-size: 12px; fill: #536d80; }
  .term-path { font-size: 12px; fill: #8fa6b8; }
  .term-cmd  { font-size: 12px; fill: #edf3f8; font-weight: 500; }

  /* Headline and Identity */
  .hero-name { font-size: 30px; font-weight: 700; fill: #edf3f8; letter-spacing: -0.4px; }
  .hero-role { font-size: 13.5px; font-weight: 500; fill: #8fa6b8; letter-spacing: 0.2px; }
  .hero-desc { font-size: 12.5px; font-weight: 400; fill: #8fa6b8; }

  /* Primary Focus Chips */
  .chip-cv-txt  { font-size: 11px; font-weight: 600; fill: #edf3f8; letter-spacing: 0.5px; }
  .chip-rag-txt { font-size: 11px; font-weight: 600; fill: #edf3f8; letter-spacing: 0.5px; }

  /* Coding Signature Lines */
  .code-fn      { font-size: 12px; font-weight: 500; fill: #55a9c9; }
  .code-op      { font-size: 12px; fill: #536d80; }
  .code-str-cv  { font-size: 12px; fill: #edf3f8; }
  .code-str-rag { font-size: 12px; fill: #9384c5; }
  .code-dom-val { font-size: 12px; fill: #edf3f8; }

  /* Right Diagonal Pipeline Labels */
  .stage-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.6px; text-anchor: middle; }
  .stage-sub { font-size: 8.5px; font-weight: 400; fill: #627d94; }

  /* Calm Keyframe Animations (Strictly 3 Animation Systems) */
  /* System 1: Terminal cursor blink (1.1s) */
  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 95% { opacity: 0; }
    100% { opacity: 1; }
  }
  .cursor-anim { animation: blink 1.1s infinite; }

  /* System 2: Ocean Wave Drift (19s) */
  @keyframes ocean-drift {
    0% { transform: translateX(0px); }
    50% { transform: translateX(-50px); }
    100% { transform: translateX(0px); }
  }
  .wave-motion { animation: ocean-drift 19s ease-in-out infinite; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="330" rx="14" fill="url(#bg)"/>
<rect width="1000" height="330" rx="14" fill="url(#grid)" mask="url(#grid-mask)"/>

<!-- ================= LEFT SIDE (50% Visual Presence: Editorial & Developer Identity) ================= -->

<!-- 1. Authentic Terminal Line -->
<g transform="translate(56, 36)" class="mono">
  <text x="0" y="0">
    <tspan class="term-user">khoa@github</tspan><tspan class="term-sep">:</tspan><tspan class="term-path">~$ </tspan><tspan class="term-cmd">./init --research</tspan>
  </text>
  <rect x="234" y="-10.5" width="7.5" height="13.5" rx="1" fill="#55a9c9" class="cursor-anim"/>
</g>

<!-- 2. Primary Developer Identity -->
<text x="56" y="86" class="sans hero-name">Ph&#7841;m H&#7891;ng &#272;&#259;ng Khoa</text>

<!-- 3. Subtitle: Role and Specializations -->
<text x="56" y="114" class="mono hero-role">
  AI Systems Engineer
  <tspan fill="#536d80"> &#183; </tspan>
  <tspan fill="#55a9c9">Computer Vision</tspan>
  <tspan fill="#536d80"> &#183; </tspan>
  <tspan fill="#9384c5">Agentic-RAG</tspan>
</text>

<!-- 4. Research Statement -->
<text x="56" y="138" class="sans hero-desc">Building measurable, evidence-aware AI systems from research to real-world use.</text>

<!-- 5. Two Primary Focus Chips (Slightly enhanced spacing and padding) -->
<g transform="translate(56, 164)" class="mono">
  <!-- Chip 1: CV / OCR Systems -->
  <g>
    <rect width="158" height="29" rx="6" fill="#081726" fill-opacity="0.65" stroke="url(#chip-cv)" stroke-width="0.95"/>
    <g transform="translate(11, 7.5)">
      <path d="M 0 4 L 0 0 L 4 0" fill="none" stroke="#55a9c9" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 10 0 L 14 0 L 14 4" fill="none" stroke="#55a9c9" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 0 10 L 0 14 L 4 14" fill="none" stroke="#55a9c9" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 10 14 L 14 14 L 14 10" fill="none" stroke="#55a9c9" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="7" cy="7" r="1.5" fill="#55a9c9"/>
    </g>
    <text x="35" y="18.5" class="chip-cv-txt">CV / OCR SYSTEMS</text>
  </g>

  <!-- Chip 2: Agentic-RAG / Evidence -->
  <g transform="translate(170, 0)">
    <rect width="198" height="29" rx="6" fill="#0f1124" fill-opacity="0.65" stroke="url(#chip-rag)" stroke-width="0.95"/>
    <g transform="translate(11, 7.5)">
      <line x1="2" y1="12" x2="7" y2="3" stroke="#9384c5" stroke-width="1.2"/>
      <line x1="12" y1="12" x2="7" y2="3" stroke="#9384c5" stroke-width="1.2"/>
      <line x1="2" y1="12" x2="12" y2="12" stroke="#9384c5" stroke-width="1.2"/>
      <circle cx="7" cy="3" r="1.8" fill="#9384c5"/>
      <circle cx="2" cy="12" r="1.6" fill="#13172e" stroke="#9384c5" stroke-width="1"/>
      <circle cx="12" cy="12" r="1.6" fill="#13172e" stroke="#9384c5" stroke-width="1"/>
    </g>
    <text x="35" y="18.5" class="chip-rag-txt">AGENTIC-RAG / EVIDENCE</text>
  </g>
</g>

<!-- 6. Coding Signature Block (Strictly 2 lines, idiomatic Python, comfortable line-height) -->
<g transform="translate(56, 236)" class="mono">
  <text x="0" y="0">
    <tspan class="code-fn">research</tspan><tspan class="code-op">.</tspan><tspan class="code-fn">focus</tspan>
    <tspan class="code-op"> = [</tspan>
    <tspan class="code-str-cv">"computer_vision"</tspan><tspan class="code-op">, </tspan>
    <tspan class="code-str-rag">"agentic_rag"</tspan>
    <tspan class="code-op">]</tspan>
  </text>
  <text x="0" y="22">
    <tspan class="code-fn">application</tspan><tspan class="code-op">.</tspan><tspan class="code-fn">domain</tspan>
    <tspan class="code-op"> = </tspan>
    <tspan class="code-dom-val">"healthcare_ai"</tspan>
  </text>
</g>

<!-- ================= PHASE 3: SUBTLE VISUAL BRIDGE ================= -->
<!-- Faint evidence trail connecting focus chips to the retrieval topology -->
<path d="M 426 178 C 530 178, 630 148, 746 138"
      fill="none" stroke="#55a9c9" stroke-width="1" stroke-dasharray="2 4" opacity="0.16"/>

<!-- ================= RIGHT SIDE (30% Visual Presence: Diagonal Asymmetric Motif) ================= -->
<!-- Expanded across x = 650 -> 920 with controlled asymmetry (observe ↘ retrieve ↘ verify) -->
<g class="mono">

  <!-- DIAGONAL CONNECTOR STREAM (Observe ↘ Retrieve ↘ Verify) -->
  <path d="M 680 88 C 715 110, 745 125, 786 142"
        fill="none" stroke="#1c3b52" stroke-width="1.1" stroke-dasharray="3 3"/>
  <path d="M 798 162 C 825 188, 852 210, 876 226"
        fill="none" stroke="#1c3b52" stroke-width="1.1" stroke-dasharray="3 3"/>

  <!-- TIER 1: OBSERVE (Top-Left of Motif, centered at x=680, y=62) -->
  <g>
    <!-- Label Above -->
    <text x="680" y="38" class="stage-lbl" fill="#55a9c9">
      observe <tspan class="stage-sub">&#183; cv / ocr</tspan>
    </text>

    <!-- Vision Target Bounding Frame (width: 108, height: 42, centered at x=680) -->
    <g transform="translate(626, 46)">
      <!-- Target Corner Brackets -->
      <path d="M 0 8 L 0 0 L 8 0" fill="none" stroke="#55a9c9" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 100 0 L 108 0 L 108 8" fill="none" stroke="#55a9c9" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 0 34 L 0 42 L 8 42" fill="none" stroke="#55a9c9" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 100 42 L 108 42 L 108 34" fill="none" stroke="#55a9c9" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Internal Feature Scan Traces -->
      <line x1="14" y1="12" x2="72" y2="12" stroke="#22445e" stroke-width="1"/>
      <line x1="14" y1="19" x2="88" y2="19" stroke="#18364d" stroke-width="1" stroke-dasharray="4 2"/>

      <!-- Detected OCR Token Box -->
      <rect x="14" y="24" width="46" height="11" rx="2" fill="#0b2438" stroke="#285675" stroke-width="0.8"/>
      <circle cx="53" cy="29.5" r="1.8" fill="#55a9c9"/>
    </g>
  </g>

  <!-- TIER 2: RETRIEVE (Center of Motif, centered at x=792, y=148) -->
  <g>
    <!-- Label Above -->
    <text x="792" y="112" class="stage-lbl" fill="#9384c5">
      retrieve <tspan class="stage-sub">&#183; multi-agent rag</tspan>
    </text>

    <!-- Multi-Agent Knowledge Topology (Asymmetric 4-node cluster) -->
    <g transform="translate(792, 148)">
      <!-- Knowledge Graph Edges -->
      <line x1="-46" y1="-10" x2="0" y2="0" stroke="#2d264a" stroke-width="1.2"/>
      <line x1="44" y1="-12" x2="0" y2="0" stroke="#2d264a" stroke-width="1.2"/>
      <line x1="32" y1="20" x2="0" y2="0" stroke="#26384a" stroke-width="1.1"/>
      <line x1="-16" y1="22" x2="0" y2="0" stroke="#203d40" stroke-width="1.2"/>

      <!-- Node 1: Evidence Document (Left) -->
      <circle cx="-46" cy="-10" r="4.5" fill="#081726" stroke="#55a9c9" stroke-width="1.2"/>

      <!-- Node 2: Parametric Knowledge (Right) -->
      <circle cx="44" cy="-12" r="4.5" fill="#0f1124" stroke="#9384c5" stroke-width="1.2"/>

      <!-- Node 3: Clinical Domain Entity (Lower-Right) -->
      <circle cx="32" cy="20" r="3.8" fill="#0b1a2b" stroke="#688ca8" stroke-width="1"/>

      <!-- Node 4: Synthesized Context (Lower-Left) -->
      <circle cx="-16" cy="22" r="4" fill="#081e22" stroke="#55aa9e" stroke-width="1.1"/>

      <!-- Central Orchestrator Agent Node -->
      <circle cx="0" cy="0" r="7.5" fill="#1b1632" stroke="#9384c5" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.6" fill="#edf3f8"/>
    </g>
  </g>

  <!-- TIER 3: VERIFY (Lower-Right of Motif, centered at x=882, y=238) -->
  <g>
    <!-- Verified Badge with Restrained Static Halo -->
    <circle cx="882" cy="238" r="15" fill="#123a38" opacity="0.35"/>
    <circle cx="882" cy="238" r="10.5" fill="#071c20" stroke="#55aa9e" stroke-width="1.4"/>
    <path d="M 878.5 238 L 881 240.5 L 886.5 235"
          fill="none" stroke="#7be3d3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Label Below -->
    <text x="882" y="266" class="stage-lbl" fill="#55aa9e">
      verify <tspan class="stage-sub">&#183; evidence grounded</tspan>
    </text>
  </g>

  <!-- System 3: SINGLE TECHNICAL SIGNAL ANIMATION (8.8s continuous journey) -->
  <circle r="2.2" fill="#7be3d3">
    <animateMotion path="M 680 88 C 715 110, 745 125, 792 148 C 825 178, 852 210, 882 238"
                   dur="8.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="0; 0.95; 0.75; 0.95; 0"
             keyTimes="0; 0.15; 0.5; 0.85; 1"
             dur="8.8s" repeatCount="indefinite"/>
  </circle>

</g>

<!-- ================= PHASE 6: CALM OCEAN REBALANCE ================= -->
<!-- Raised 14px to y=302 to balance the bottom mass; only 1 wave animated -->
<g>
  <!-- Static Ambient Ocean Base Silhouette -->
  <path d="M 0 302 Q 260 286, 520 300 T 1000 294 L 1000 330 L 0 330 Z" fill="#081a29" opacity="0.26"/>

  <!-- Static Ghost Wave Line (Nearly imperceptible) -->
  <path d="M 0 314 Q 240 306, 500 314 T 1000 310" fill="none" stroke="#0b2438" stroke-width="0.9" opacity="0.12"/>

  <!-- Animated Main Ocean Wave (Single drifting wave line, 19s) -->
  <g class="wave-motion">
    <path d="M -100 308 Q 150 298, 400 308 T 900 302 T 1400 308"
          fill="none" stroke="#123752" stroke-width="1.2" opacity="0.26"/>
  </g>
</g>

</svg>