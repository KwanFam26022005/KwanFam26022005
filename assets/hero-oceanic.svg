<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Pham Hong Dang Khoa - Computer Vision, Agentic-RAG, Healthcare AI">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04101e"/>
    <stop offset="0.58" stop-color="#071b31"/>
    <stop offset="1" stop-color="#0a2840"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0b3550" stop-opacity=".12"/>
    <stop offset=".5" stop-color="#0e7490" stop-opacity=".36"/>
    <stop offset="1" stop-color="#14b8a6" stop-opacity=".12"/>
  </linearGradient>
  <radialGradient id="moon" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#d9f7ff"/>
    <stop offset=".72" stop-color="#7dd3fc"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity=".16"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity=".055" stroke-width=".6"/>
  </pattern>
</defs>

<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .code{font-size:11px;fill:#72a7c7;letter-spacing:.3px}
  .name{font-size:39px;font-weight:800;fill:#f8fafc;letter-spacing:-.5px}
  .role{font-size:15px;font-weight:500;fill:#a7c7e7}
  .desc{font-size:12.5px;fill:#8faabd}
  .pill{font-size:10.5px;font-weight:650;fill:#d9efff}
  .track-no{font-size:10px;fill:#557a96;letter-spacing:1px}
  .track{font-size:11.5px;font-weight:650;letter-spacing:.7px}
  .micro{font-size:9.5px;fill:#5f8eaa;letter-spacing:1.5px}
</style>

<rect width="1000" height="340" rx="20" fill="url(#bg)"/>
<rect width="1000" height="340" rx="20" fill="url(#grid)"/>

<!-- quiet ocean horizon -->
<path d="M0 252 C165 220 292 241 430 262 C582 286 738 264 1000 230 V340 H0Z" fill="url(#sea)"/>
<path d="M-20 282 C170 242 310 300 495 270 S810 244 1020 270" fill="none" stroke="#38bdf8" stroke-opacity=".38" stroke-width="1.1">
  <animateTransform attributeName="transform" type="translate" values="0 0;-22 0;0 0" dur="16s" repeatCount="indefinite"/>
</path>
<path d="M-20 299 C190 269 326 319 518 288 S822 272 1020 294" fill="none" stroke="#2dd4bf" stroke-opacity=".24" stroke-width=".9">
  <animateTransform attributeName="transform" type="translate" values="0 0;18 0;0 0" dur="20s" repeatCount="indefinite"/>
</path>

<!-- landscape / moon, kept editorial and subtle -->
<path d="M704 218 C754 181 792 191 830 178 C875 163 920 187 1000 164 V248 H704Z" fill="#061626" opacity=".86"/>
<path d="M757 232 C812 202 849 213 889 198 C925 184 958 199 1000 188 V248 H757Z" fill="#081b2d" opacity=".95"/>
<circle cx="883" cy="153" r="34" fill="url(#moon)" opacity=".86">
  <animate attributeName="opacity" values=".78;.92;.78" dur="11s" repeatCount="indefinite"/>
</circle>
<g opacity=".4">
  <line x1="835" y1="193" x2="929" y2="193" stroke="#7dd3fc" stroke-width="1"/>
  <line x1="848" y1="200" x2="918" y2="200" stroke="#38bdf8" stroke-width=".8"/>
  <line x1="860" y1="207" x2="906" y2="207" stroke="#2dd4bf" stroke-width=".7"/>
</g>

<!-- restrained drifting particles -->
<g fill="#7dd3fc">
  <circle cx="661" cy="64" r="1.5" opacity=".35"><animate attributeName="cy" values="64;57;64" dur="13s" repeatCount="indefinite"/></circle>
  <circle cx="735" cy="91" r="1.2" opacity=".28"><animate attributeName="cx" values="735;742;735" dur="17s" repeatCount="indefinite"/></circle>
  <circle cx="945" cy="82" r="1.4" opacity=".25"><animate attributeName="cy" values="82;74;82" dur="19s" repeatCount="indefinite"/></circle>
</g>

<!-- coding cue -->
<g transform="translate(46 38)" class="mono">
  <text class="code">&gt; init_profile --research --build-real-systems</text>
  <rect x="298" y="-10" width="6" height="13" rx="1" fill="#5eead4">
    <animate attributeName="opacity" values="1;.12;1" dur="1.15s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- identity -->
<g transform="translate(46 116)" class="sans">
  <text class="name">Phạm Hồng Đăng Khoa</text>
  <rect x="423" y="-31" width="3" height="34" rx="1.5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;.18;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
  <text y="31" class="role">AI Systems · Computer Vision · Agentic-RAG</text>
  <text y="58" class="desc">Building measurable, evidence-aware AI systems from research to real-world use.</text>
</g>

<!-- small specialization pills, not dashboard cards -->
<g transform="translate(46 199)" class="sans">
  <g>
    <rect width="122" height="28" rx="14" fill="#071b2d" stroke="#38bdf8" stroke-opacity=".62"/>
    <circle cx="16" cy="14" r="3.5" fill="#38bdf8"/>
    <text x="29" y="18" class="pill">CV / OCR</text>
  </g>
  <g transform="translate(132)">
    <rect width="145" height="28" rx="14" fill="#10182d" stroke="#8b5cf6" stroke-opacity=".68"/>
    <circle cx="16" cy="14" r="3.5" fill="#8b5cf6"/>
    <text x="29" y="18" class="pill">AGENTIC-RAG</text>
  </g>
  <g transform="translate(287)">
    <rect width="142" height="28" rx="14" fill="#08231f" stroke="#2dd4bf" stroke-opacity=".56"/>
    <circle cx="16" cy="14" r="3.5" fill="#2dd4bf"/>
    <text x="29" y="18" class="pill">HEALTHCARE AI</text>
  </g>
</g>

<!-- minimal research index -->
<g transform="translate(46 276)" class="mono">
  <text class="track-no">01</text><text x="30" class="track" fill="#7dd3fc">vision / ocr</text>
  <text x="164" class="track-no">02</text><text x="194" class="track" fill="#a78bfa">agentic-rag / evidence</text>
  <text x="393" class="track-no">03</text><text x="423" class="track" fill="#5eead4">healthcare / clinical</text>
</g>

<g transform="translate(827 286)" class="mono micro">
  <text y="0">CALM CODE</text>
  <text y="14">DEEP WORK</text>
  <text y="28">REAL IMPACT</text>
</g>
</svg>