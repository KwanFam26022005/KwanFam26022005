<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Phạm Hồng Đăng Khoa — AI Systems Engineer focused on Computer Vision and Agentic-RAG">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#050d16"/>
    <stop offset="52%" stop-color="#07131f"/>
    <stop offset="100%" stop-color="#081927"/>
  </linearGradient>
  <linearGradient id="chip-cv" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#6098ad" stop-opacity="0.62"/>
    <stop offset="100%" stop-color="#3f6c7d" stop-opacity="0.18"/>
  </linearGradient>
  <linearGradient id="chip-rag" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8a80ad" stop-opacity="0.62"/>
    <stop offset="100%" stop-color="#625a7d" stop-opacity="0.18"/>
  </linearGradient>
  <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.55" fill="#173044" opacity="0.12"/>
  </pattern>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .term-user{font-size:11px;fill:#6098ad;font-weight:600}
  .term-sep{font-size:11px;fill:#526b7c}
  .term-path{font-size:11px;fill:#8c9dac}
  .term-cmd{font-size:11px;fill:#e8eef2;font-weight:500}
  .hero-name{font-size:29px;font-weight:700;fill:#edf2f5;letter-spacing:-.2px}
  .hero-role{font-size:12.5px;font-weight:500;fill:#8c9dac;letter-spacing:.1px}
  .hero-desc{font-size:12px;font-weight:400;fill:#8396a5}
  .chip-text{font-size:10px;font-weight:600;fill:#e8eef2;letter-spacing:.35px}
  .code-key{font-size:10.5px;font-weight:500;fill:#6098ad}
  .code-op{font-size:10.5px;fill:#526b7c}
  .code-val{font-size:10.5px;fill:#dbe5eb}
  .code-rag{font-size:10.5px;fill:#8a80ad}
  .code-health{font-size:10.5px;fill:#5f958b}
  .stage{font-size:9px;font-weight:600;letter-spacing:.6px}
  .tiny{font-size:8px;fill:#536d7d;letter-spacing:.2px}
</style>

<rect width="1000" height="330" rx="14" fill="url(#bg)"/>
<rect width="1000" height="330" rx="14" fill="url(#grid)"/>

<!-- subtle personal ocean/celestial signature -->
<g transform="translate(925 38)" opacity=".55">
  <circle r="6" fill="#8196a5" opacity=".28"/>
  <path d="M2 -5 A6 6 0 0 1 2 5 A5 5 0 0 0 2 -5Z" fill="#385064" opacity=".65"/>
</g>

<!-- identity -->
<g transform="translate(48 32)" class="mono">
  <text><tspan class="term-user">khoa@github</tspan><tspan class="term-sep">:</tspan><tspan class="term-path">~$ </tspan><tspan class="term-cmd">./init --research</tspan></text>
  <rect x="216" y="-9" width="6" height="12" rx="1" fill="#6098ad">
    <animate attributeName="opacity" values="1;.12;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>

<text x="48" y="80" class="sans hero-name">Ph&#7841;m H&#7891;ng &#272;&#259;ng Khoa</text>
<text x="48" y="108" class="mono hero-role">
  AI Systems Engineer<tspan fill="#526b7c"> &#183; </tspan><tspan fill="#6098ad">Computer Vision</tspan><tspan fill="#526b7c"> &#183; </tspan><tspan fill="#8a80ad">Agentic-RAG</tspan>
</text>
<text x="48" y="132" class="sans hero-desc">Building measurable, evidence-aware AI systems from research to real-world use.</text>

<!-- two primary focus chips; light surfaces only -->
<g transform="translate(48 156)" class="mono">
  <g>
    <rect width="148" height="27" rx="6" fill="#091824" fill-opacity=".34" stroke="url(#chip-cv)" stroke-width=".7"/>
    <g transform="translate(10 7)" stroke="#6098ad" stroke-width="1" fill="none" stroke-linecap="round">
      <path d="M0 4V0h4M10 0h4v4M0 10v4h4M10 14h4v-4"/>
      <circle cx="7" cy="7" r="1.4" fill="#6098ad" stroke="none"/>
    </g>
    <text x="31" y="17.5" class="chip-text">CV / OCR SYSTEMS</text>
  </g>
  <g transform="translate(160)">
    <rect width="184" height="27" rx="6" fill="#0d1525" fill-opacity=".32" stroke="url(#chip-rag)" stroke-width=".7"/>
    <g transform="translate(10 7)" stroke="#8a80ad" stroke-width=".85" fill="none">
      <line x1="7" y1="2" x2="2" y2="11"/><line x1="7" y1="2" x2="12" y2="11"/><line x1="2" y1="11" x2="12" y2="11"/>
      <circle cx="7" cy="2" r="1.6" fill="#8a80ad" stroke="none"/><circle cx="2" cy="11" r="1.5"/><circle cx="12" cy="11" r="1.5"/>
    </g>
    <text x="31" y="17.5" class="chip-text">AGENTIC-RAG / EVIDENCE</text>
  </g>
</g>

<!-- coding signature: no container, no duplicate pipeline caption -->
<g transform="translate(48 220)" class="mono">
  <text>
    <tspan class="code-key">research.focus</tspan><tspan class="code-op"> = [</tspan><tspan class="code-val">"computer_vision"</tspan><tspan class="code-op">, </tspan><tspan class="code-rag">"agentic_rag"</tspan><tspan class="code-op">]</tspan>
  </text>
  <text y="20">
    <tspan class="code-key">application.domain</tspan><tspan class="code-op"> = </tspan><tspan class="code-health">"healthcare_ai"</tspan>
  </text>
</g>

<!-- floating asymmetric research motif: observe -> retrieve -> verify -->
<g class="mono">
  <!-- one quiet path replaces rigid stage connectors -->
  <path d="M724 88 C742 112 771 120 786 151 S808 205 824 236" fill="none" stroke="#183244" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- observe / CV: brackets only, no scan container -->
  <g transform="translate(718 54)">
    <text x="0" y="-10" class="stage" fill="#6098ad">observe</text>
    <path d="M0 5V0h6M78 0h6v5M0 29v5h6M78 34h6v-5" fill="none" stroke="#6098ad" stroke-width="1.05" stroke-linecap="round"/>
    <line x1="11" y1="10" x2="51" y2="10" stroke="#203a4d" stroke-width="1"/>
    <line x1="11" y1="16" x2="61" y2="16" stroke="#172d3d" stroke-width="1"/>
    <rect x="11" y="22" width="34" height="7" rx="1.5" fill="#6098ad" fill-opacity=".08" stroke="#486f80" stroke-width=".55"/>
    <text x="0" y="47" class="tiny">cv / ocr</text>
  </g>

  <!-- retrieve / RAG: compact constellation shifted right -->
  <g transform="translate(788 157)">
    <text x="-4" y="-24" class="stage" fill="#8a80ad">retrieve</text>
    <line x1="0" y1="0" x2="-25" y2="-11" stroke="#25243b" stroke-width=".9"/>
    <line x1="0" y1="0" x2="27" y2="-9" stroke="#25243b" stroke-width=".9"/>
    <line x1="0" y1="0" x2="10" y2="24" stroke="#1d3439" stroke-width=".9"/>
    <circle r="7.5" fill="#101525" stroke="#8a80ad" stroke-width=".9"/>
    <circle r="2.2" fill="#8a80ad"/>
    <circle cx="-25" cy="-11" r="3.7" fill="#091722" stroke="#6098ad" stroke-width=".75"/>
    <circle cx="27" cy="-9" r="3.7" fill="#121223" stroke="#8a80ad" stroke-width=".75"/>
    <circle cx="10" cy="24" r="3.7" fill="#0a1b1d" stroke="#5f958b" stroke-width=".75"/>
    <text x="-4" y="42" class="tiny">agentic-rag</text>
  </g>

  <!-- verify: one quiet evidence node -->
  <g transform="translate(824 242)">
    <circle r="8" fill="#0a1b1d" stroke="#5f958b" stroke-width=".9"/>
    <path d="M-3 0L-1 2.2L3.8-2.2" fill="none" stroke="#5f958b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="16" y="3" class="stage" fill="#5f958b">verify</text>
  </g>

  <!-- single technical animation: signal flows through the research motif -->
  <circle r="2" fill="#69a79a" opacity=".9">
    <animateMotion path="M724 88 C742 112 771 120 786 151 S808 205 824 236" dur="9.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- one ambient ocean animation -->
<path d="M-120 316 Q140 307 400 316 T920 311 T1440 316" fill="none" stroke="#164054" stroke-width="1" opacity=".16">
  <animateTransform attributeName="transform" type="translate" values="0,0;-120,0;0,0" dur="20s" repeatCount="indefinite"/>
</path>
<path d="M0 326 Q280 313 540 324 T1000 318 L1000 330 L0 330Z" fill="#081b29" opacity=".18"/>
</svg>