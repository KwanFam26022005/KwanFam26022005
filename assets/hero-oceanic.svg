<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Phạm Hồng Đăng Khoa — AI Systems Engineer focused on Computer Vision and Agentic-RAG">
<defs>
  <!-- Deep Navy Ocean Night Sky -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#050e18"/>
    <stop offset="50%" stop-color="#07131f"/>
    <stop offset="100%" stop-color="#081a29"/>
  </linearGradient>

  <!-- Specialization Chip Borders (Low Saturation) -->
  <linearGradient id="chip-cv" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#55a9c9" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#3b7a94" stop-opacity="0.3"/>
  </linearGradient>

  <linearGradient id="chip-rag" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9384c5" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#695b96" stop-opacity="0.3"/>
  </linearGradient>

  <!-- Subtle Coordinate Grid -->
  <pattern id="grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.7" fill="#163044" opacity="0.22"/>
  </pattern>
</defs>

<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* Terminal Header */
  .term-user { font-size: 11.5px; fill: #55a9c9; font-weight: 600; }
  .term-sep  { font-size: 11.5px; fill: #58778c; }
  .term-path { font-size: 11.5px; fill: #8fa6b8; }
  .term-cmd  { font-size: 11.5px; fill: #edf3f8; font-weight: 500; }

  /* Headline and Identity */
  .hero-name { font-size: 30px; font-weight: 700; fill: #edf3f8; letter-spacing: -0.4px; }
  .hero-role { font-size: 13px; font-weight: 500; fill: #8fa6b8; letter-spacing: 0.2px; }
  .hero-desc { font-size: 12.5px; font-weight: 400; fill: #8fa6b8; }

  /* Primary Specialization Chips */
  .chip-cv-txt  { font-size: 10.5px; font-weight: 600; fill: #edf3f8; letter-spacing: 0.5px; }
  .chip-rag-txt { font-size: 10.5px; font-weight: 600; fill: #edf3f8; letter-spacing: 0.5px; }

  /* Coding Signature Lines (Directly on background) */
  .code-fn      { font-size: 11px; font-weight: 500; fill: #55a9c9; }
  .code-op      { font-size: 11px; fill: #58778c; }
  .code-str-cv  { font-size: 11px; fill: #edf3f8; }
  .code-str-rag { font-size: 11px; fill: #9384c5; }
  .code-dom     { font-size: 11px; font-weight: 500; fill: #55aa9e; }
  .code-dom-val { font-size: 11px; fill: #edf3f8; }
  .code-note    { font-size: 9.5px; font-weight: 400; fill: #58778c; font-style: italic; }

  /* Right Floating Pipeline Labels */
  .stage-lbl { font-size: 9px; font-weight: 600; letter-spacing: 0.5px; text-anchor: middle; }
  .stage-sub { font-size: 8px; font-weight: 400; fill: #58778c; }
</style>

<!-- Canvas Base -->
<rect width="1000" height="340" rx="14" fill="url(#bg)"/>
<rect width="1000" height="340" rx="14" fill="url(#grid)"/>

<!-- ================= LEFT SIDE (60-65% Negative Space & Typography) ================= -->

<!-- 1. Single Terminal Identity Line -->
<g transform="translate(48, 32)" class="mono">
  <text x="0" y="0">
    <tspan class="term-user">khoa@github</tspan><tspan class="term-sep">:</tspan><tspan class="term-path">~$ </tspan><tspan class="term-cmd">./init --research</tspan>
  </text>
  <!-- Blinking Terminal Cursor (1.1s) -->
  <rect x="226" y="-10" width="7" height="13" rx="1" fill="#55a9c9">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- 2. Name Headline (Editorial, clean, no overlapping elements) -->
<text x="48" y="82" class="sans hero-name">Ph&#7841;m H&#7891;ng &#272;&#259;ng Khoa</text>

<!-- 3. Subtitle: Role & Primary Specializations -->
<text x="48" y="110" class="mono hero-role">
  AI Systems Engineer
  <tspan fill="#58778c"> &#183; </tspan>
  <tspan fill="#55a9c9">Computer Vision</tspan>
  <tspan fill="#58778c"> &#183; </tspan>
  <tspan fill="#9384c5">Agentic-RAG</tspan>
</text>

<!-- 4. Research Statement -->
<text x="48" y="134" class="sans hero-desc">Building measurable, evidence-aware AI systems from research to real-world use.</text>

<!-- 5. Two Compact Focus Chips (Only Two, Restrained Accent) -->
<g transform="translate(48, 158)" class="mono">
  <!-- Chip 1: CV / OCR Systems -->
  <g>
    <rect width="154" height="28" rx="6" fill="#091b2c" fill-opacity="0.6" stroke="url(#chip-cv)" stroke-width="0.9"/>
    <!-- Minimal Reticle Icon -->
    <g transform="translate(10, 7)">
      <path d="M 0 3.5 L 0 0 L 3.5 0" fill="none" stroke="#55a9c9" stroke-width="1.1"/>
      <path d="M 10.5 0 L 14 0 L 14 3.5" fill="none" stroke="#55a9c9" stroke-width="1.1"/>
      <path d="M 0 10.5 L 0 14 L 3.5 14" fill="none" stroke="#55a9c9" stroke-width="1.1"/>
      <path d="M 10.5 14 L 14 14 L 14 10.5" fill="none" stroke="#55a9c9" stroke-width="1.1"/>
      <circle cx="7" cy="7" r="2" fill="#55a9c9"/>
    </g>
    <text x="32" y="18" class="chip-cv-txt">CV / OCR SYSTEMS</text>
  </g>

  <!-- Chip 2: Agentic-RAG / Evidence -->
  <g transform="translate(166, 0)">
    <rect width="192" height="28" rx="6" fill="#0d172e" fill-opacity="0.6" stroke="url(#chip-rag)" stroke-width="0.9"/>
    <!-- Minimal 3-Node Connected Icon -->
    <g transform="translate(10, 7)">
      <circle cx="7" cy="2.5" r="1.7" fill="#9384c5"/>
      <circle cx="2" cy="11.5" r="1.7" fill="#9384c5"/>
      <circle cx="12" cy="11.5" r="1.7" fill="#9384c5"/>
      <line x1="7" y1="2.5" x2="2" y2="11.5" stroke="#9384c5" stroke-width="0.8" opacity="0.7"/>
      <line x1="7" y1="2.5" x2="12" y2="11.5" stroke="#9384c5" stroke-width="0.8" opacity="0.7"/>
      <line x1="2" y1="11.5" x2="12" y2="11.5" stroke="#9384c5" stroke-width="0.8" opacity="0.7"/>
    </g>
    <text x="32" y="18" class="chip-rag-txt">AGENTIC-RAG / EVIDENCE</text>
  </g>
</g>

<!-- 6. Coding Signature Lines (Directly on canvas - NO bordered card) -->
<g transform="translate(48, 222)" class="mono">
  <!-- Line 1: research.focus -->
  <text x="0" y="0">
    <tspan class="code-fn">research.focus</tspan> <tspan class="code-op">=</tspan> <tspan class="code-op">[</tspan><tspan class="code-str-cv">"computer_vision"</tspan><tspan class="code-op">, </tspan><tspan class="code-str-rag">"agentic_rag"</tspan><tspan class="code-op">]</tspan>
  </text>
  <!-- Line 2: application.domain -->
  <text x="0" y="20">
    <tspan class="code-dom">application.domain</tspan> <tspan class="code-op">=</tspan> <tspan class="code-dom-val">"healthcare_ai"</tspan>
  </text>
  <!-- Line 3: Signature note -->
  <text x="0" y="42" class="code-note">// observe &#8594; retrieve &#8594; verify</text>
</g>

<!-- ================= RIGHT SIDE (35-40% Floating Abstract Research Pipeline) ================= -->
<!-- Fully floating along vertical axis x = 760: NO outer rectangular container, NO window chrome, NO fake telemetry -->
<g>

  <!-- Serene Understated Moon (Subtle, integrated, non-dominant) -->
  <g transform="translate(920, 42)">
    <circle cx="0" cy="0" r="14" fill="#55a9c9" opacity="0.08">
      <animate attributeName="opacity" values="0.05; 0.12; 0.05" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#8fa6b8" opacity="0.35"/>
  </g>

  <!-- STAGE 1: OBSERVE (Computer Vision / OCR) centered at x = 760 -->
  <g class="mono">
    <text x="760" y="46" class="stage-lbl" fill="#55a9c9">
      observe <tspan class="stage-sub">&#183; cv / ocr</tspan>
    </text>

    <!-- Minimal Scan Boundary Motif centered at 760 (width 104, from 708 to 812) -->
    <g transform="translate(708, 54)">
      <rect width="104" height="42" rx="3" fill="#0a1a29" fill-opacity="0.4" stroke="#17344a" stroke-width="0.8"/>
      <!-- 4 Corner Reticle Brackets -->
      <path d="M -2 6 L -2 -2 L 6 -2" fill="none" stroke="#55a9c9" stroke-width="1.1"/>
      <path d="M 98 -2 L 106 -2 L 106 6" fill="none" stroke="#55a9c9" stroke-width="1.1"/>
      <path d="M -2 36 L -2 44 L 6 44" fill="none" stroke="#55a9c9" stroke-width="1.1"/>
      <path d="M 98 44 L 106 44 L 106 36" fill="none" stroke="#55a9c9" stroke-width="1.1"/>

      <!-- 2 Subtle Document Skeleton Lines -->
      <rect x="10" y="11" width="50" height="1.8" rx="0.9" fill="#17344a"/>
      <rect x="10" y="17" width="68" height="1.8" rx="0.9" fill="#17344a"/>

      <!-- Single Detected Bounding Box -->
      <rect x="10" y="24" width="42" height="11" rx="1.5" fill="#55a9c9" fill-opacity="0.12" stroke="#55a9c9" stroke-width="0.7"/>

      <!-- Subtle Vertical Scanning Laser Beam (8s slow sweep) -->
      <line x1="2" y1="4" x2="102" y2="4" stroke="#55a9c9" stroke-width="0.9" opacity="0.65">
        <animate attributeName="y1" values="4; 38; 4" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="4; 38; 4" dur="8s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- CONNECTOR 1: Flow Line from Observe to Retrieve (x = 760) -->
  <line x1="760" y1="102" x2="760" y2="132" stroke="#17344a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- STAGE 2: RETRIEVE (Agentic-RAG Constellation) centered at x = 760 -->
  <g class="mono">
    <text x="760" y="142" class="stage-lbl" fill="#9384c5">
      retrieve <tspan class="stage-sub">&#183; multi-agent rag</tspan>
    </text>

    <!-- Constellation Graph Centered at (760, 172) -->
    <g transform="translate(760, 172)">
      <!-- Connecting Graph Lines -->
      <line x1="0" y1="0" x2="-34" y2="-12" stroke="#17344a" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="34" y2="-12" stroke="#1f2347" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#13383a" stroke-width="0.9"/>

      <!-- Satellite Node 1 (Document Store) -->
      <circle cx="-34" cy="-12" r="4.5" fill="#091b2c" stroke="#55a9c9" stroke-width="0.8"/>
      <!-- Satellite Node 2 (Knowledge Base) -->
      <circle cx="34" cy="-12" r="4.5" fill="#14112e" stroke="#9384c5" stroke-width="0.8"/>

      <!-- Central Orchestration Node [RAG] -->
      <circle cx="0" cy="0" r="9" fill="#0d172e" stroke="#9384c5" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="2.8" fill="#9384c5"/>

      <!-- Satellite Node 3 (Evidence Bridge) -->
      <circle cx="0" cy="28" r="4.5" fill="#091f24" stroke="#55aa9e" stroke-width="0.8"/>
    </g>
  </g>

  <!-- CONNECTOR 2: Flow Line from Retrieve to Verify (x = 760) -->
  <line x1="760" y1="206" x2="760" y2="230" stroke="#13383a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- STAGE 3: VERIFY (Evidence Verification Node) centered at x = 760 -->
  <g class="mono">
    <!-- Verification Node with Breathing Aura -->
    <g transform="translate(760, 248)">
      <!-- Subtle Pulse Aura (6s) -->
      <circle cx="0" cy="0" r="13" fill="#55aa9e" opacity="0.08">
        <animate attributeName="r" values="12; 15.5; 12" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.06; 0.16; 0.06" dur="6s" repeatCount="indefinite"/>
      </circle>
      <!-- Core Node -->
      <circle cx="0" cy="0" r="9" fill="#091f24" stroke="#55aa9e" stroke-width="1"/>
      <!-- Clean Checkmark -->
      <path d="M -3.5 0 L -1 2.5 L 4 -2" fill="none" stroke="#55aa9e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Text Label Centered Below Node -->
    <text x="760" y="272" class="stage-lbl" fill="#55aa9e">
      verify <tspan class="stage-sub">&#183; evidence grounded</tspan>
    </text>
  </g>

  <!-- UNIFIED DATA FLOW PARTICLE (Single flowing dot 9s: observe -> retrieve -> verify) -->
  <circle r="2.2" fill="#55aa9e">
    <animateMotion path="M 760 75 L 760 172 L 760 248" dur="9s" repeatCount="indefinite"/>
  </circle>

</g>

<!-- ================= BOTTOM OCEAN SIGNAL (Calm, Very Slow Ambient Horizon) ================= -->
<g>
  <!-- Distant Mountain Horizon Silhouette -->
  <path d="M 0 326 Q 280 308, 540 322 T 1000 316 L 1000 340 L 0 340 Z" fill="#081c2c" opacity="0.25"/>

  <!-- Main Wave Line (18s slow drift, low opacity) -->
  <path d="M -100 326 Q 150 316, 400 326 T 900 320 T 1400 326" fill="none" stroke="#0e2a40" stroke-width="1.1" opacity="0.22">
    <animateTransform attributeName="transform" type="translate" values="0,0; -100,0; 0,0" dur="18s" repeatCount="indefinite"/>
  </path>

  <!-- Ghost Wave Line (20s slow counter-drift, low opacity) -->
  <path d="M -100 332 Q 200 324, 500 332 T 1000 328 T 1500 332" fill="none" stroke="#133d47" stroke-width="0.8" opacity="0.15">
    <animateTransform attributeName="transform" type="translate" values="0,0; 100,0; 0,0" dur="20s" repeatCount="indefinite"/>
  </path>
</g>

</svg>
