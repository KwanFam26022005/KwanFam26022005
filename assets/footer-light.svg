<svg xmlns="http://www.w3.org/2000/svg" width="960" height="60" viewBox="0 0 960 60" role="img" aria-label="Profile footer">
<defs>
  <style>
    :root {
      --line: #d0d7de;
      --dot: #0969da;
      --text: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --line: #30363d;
        --dot: #58a6ff;
        --text: #8b949e;
      }
    }
    .txt {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      fill: var(--text);
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 500;
    }
  </style>
</defs>
<path d="M 160 14 Q 480 8, 800 14" stroke="var(--line)" stroke-width="1.2" fill="none"/>
<circle cx="480" cy="11" r="2.5" fill="var(--dot)"/>
<text x="480" y="42" text-anchor="middle" class="txt">OBSERVE · RETRIEVE · VERIFY</text>
</svg>
