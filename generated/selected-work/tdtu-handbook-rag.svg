<svg xmlns="http://www.w3.org/2000/svg" width="460" height="210" viewBox="0 0 460 210" role="img" aria-label="TDTU Student Handbook Chatbot">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #8ca4bc; }
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16.5px; font-weight: 700; fill: #edf2f7; }
  .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11.5px; fill: #7d91a3; }
  .proof-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; font-weight: 700; fill: #50677c; letter-spacing: 0.8px; }
  .proof-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #d6e2eb; }
  .stack { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 10px; fill: #728a9e; }
</style>
<rect width="460" height="210" rx="12" fill="#080d15"/>
<rect x="8" y="8" width="444" height="194" rx="10" fill="#0b121c" stroke="#1c293a" stroke-width="1"/>

<!-- Category Badge (Calm Matte Slate) -->
<rect x="22" y="20" width="140" height="20" rx="4" fill="#121b27" stroke="#223347" stroke-width="0.75"/>
<circle cx="31" cy="30" r="2.2" fill="#5a7d9b"/>
<text x="39" y="33.5" class="badge">DOMAIN RAG · QLoRA</text>

<!-- Subdued Link Arrow -->
<path d="M422 24 L430 24 L430 32 M430 24 L423 31" stroke="#486177" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

<!-- Title -->
<text x="22" y="62" class="title">TDTU Student Handbook Chatbot</text>

<!-- Description -->
<text x="22" y="81" class="desc">Vietnamese institutional QA combining hybrid BM25 + dense retrieval,</text>
<text x="22" y="97" class="desc">cross-encoder reranking, and domain-adapted QLoRA fine-tuning.</text>

<!-- Subtle Divider -->
<line x1="22" y1="111" x2="438" y2="111" stroke="#162230" stroke-width="0.75"/>

<!-- Signal / Proof (Clean White-Slate, No Neon) -->
<text x="22" y="127" class="proof-label">ENGINEERING EVIDENCE</text>
<text x="22" y="144" class="proof-value">Recall@5: 86.0% · Best BERTScore F1: 77.93 · Domain-adapted LLM</text>

<!-- Stack Pill (Understated Inset) -->
<rect x="22" y="158" width="416" height="26" rx="4" fill="#0e1622" stroke="#1a2736" stroke-width="0.75"/>
<text x="32" y="175" class="stack">BGE-M3 · QLoRA · FAISS · BM25 · PyTorch · FastAPI</text>
</svg>