<svg xmlns="http://www.w3.org/2000/svg" width="460" height="210" viewBox="0 0 460 210" role="img" aria-label="TDTU Student Handbook Chatbot">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #1d4ed8; }
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16.5px; font-weight: 700; fill: #0f172a; }
  .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11.5px; fill: #475569; }
  .proof-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
  .proof-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #0f172a; }
  .stack { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 10px; fill: #334155; font-weight: 500; }
</style>

<!-- Outer Backdrop & Elevated Card Shell -->
<rect width="460" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>

<!-- Category Badge (High Contrast Pill) -->
<rect x="20" y="18" width="142" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<circle cx="31" cy="29" r="2.5" fill="#2563eb"/>
<text x="40" y="32.5" class="badge">DOMAIN RAG · QLoRA</text>

<!-- Subdued Link Arrow Pill -->
<g transform="translate(420, 18)">
  <rect width="22" height="22" rx="5" fill="#f8fafc" stroke="#d0d7de" stroke-width="1"/>
  <path d="M7 15 L15 7 M15 7 L9 7 M15 7 L15 13" stroke="#0969da" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>

<!-- Title -->
<text x="20" y="65" class="title">TDTU Student Handbook Chatbot</text>

<!-- Description -->
<text x="20" y="84" class="desc">Vietnamese institutional QA combining hybrid BM25 + dense retrieval,</text>
<text x="20" y="100" class="desc">cross-encoder reranking, and domain-adapted QLoRA fine-tuning.</text>

<!-- Subtle Divider -->
<line x1="20" y1="114" x2="440" y2="114" stroke="#e2e8f0" stroke-width="1"/>

<!-- Signal / Proof -->
<text x="20" y="130" class="proof-label">ENGINEERING EVIDENCE</text>
<g transform="translate(20, 147)">
  <path d="M0 2 L4 5.5 L0 9" stroke="#0969da" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="12" y="7.5" class="proof-value">Recall@5: 86.0% · Best BERTScore F1: 77.93 · Domain-adapted LLM</text>
</g>

<!-- Stack Pill (High Contrast Inset) -->
<rect x="20" y="161" width="420" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="32" y="178" class="stack">BGE-M3 · QLoRA · FAISS · BM25 · PyTorch · FastAPI</text>
</svg>