<svg xmlns="http://www.w3.org/2000/svg" width="460" height="210" viewBox="0 0 460 210" role="img" aria-label="TDTU Student Handbook Chatbot">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16.5px; font-weight: 700; fill: #f8fafc; }
  .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11.5px; fill: #94a3b8; }
  .proof-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; font-weight: 700; fill: #52758d; letter-spacing: 0.8px; }
  .proof-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11.5px; font-weight: 600; }
  .stack { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 10px; fill: #8eaec4; }
</style>
<rect width="460" height="210" rx="14" fill="#06111f"/>
<rect x="10" y="10" width="440" height="190" rx="10" fill="#081829" stroke="#153a55" stroke-width="1"/>
<rect x="10" y="10" width="440" height="3" rx="1.5" fill="#2dd4bf" opacity="0.85"/>

<!-- Category Badge -->
<rect x="24" y="22" width="135" height="20" rx="4" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="0.8"/>
<text x="91.5" y="36" text-anchor="middle" class="badge" fill="#2dd4bf">DOMAIN RAG · QLoRA</text>

<!-- Arrow Icon -->
<path d="M418 26 L428 26 L428 36 M428 26 L420 34" stroke="#2dd4bf" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75"/>

<!-- Title -->
<text x="24" y="64" class="title">TDTU Student Handbook Chatbot</text>

<!-- Description -->
<text x="24" y="84" class="desc">Vietnamese institutional QA combining hybrid BM25 + dense retrieval,</text>
<text x="24" y="101" class="desc">cross-encoder reranking, and domain-adapted QLoRA fine-tuning.</text>

<!-- Divider -->
<line x1="24" y1="115" x2="436" y2="115" stroke="#13344d" stroke-width="0.75"/>

<!-- Signal / Proof -->
<text x="24" y="130" class="proof-label">ENGINEERING EVIDENCE</text>
<text x="24" y="147" class="proof-value" fill="#2dd4bf">Recall@5: 86.0% · Best BERTScore F1: 77.93 · Domain-adapted LLM</text>

<!-- Stack Pill -->
<rect x="24" y="162" width="412" height="26" rx="4" fill="#0b1f33" stroke="#15364f" stroke-width="0.6"/>
<text x="34" y="179" class="stack">BGE-M3 · QLoRA · FAISS · BM25 · PyTorch · FastAPI</text>
</svg>